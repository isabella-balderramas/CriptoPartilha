/* ---------- Caminho rápido ---------- */
.rap{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;background:var(--bg)}
.rap-top{display:flex;align-items:center;justify-content:space-between;gap:16px 28px;flex-wrap:wrap;padding:18px clamp(16px,4vw,48px);border-bottom:1px solid var(--line)}
.rap-top .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.rap-top .brand b{font-family:var(--f-display);font-weight:400;font-size:1.25rem}
.rap-steps{display:flex;gap:6px 22px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.rap-steps li>span,.rap-steps li>button{display:flex;align-items:center;gap:8px;font:inherit;font-size:.92rem;color:var(--muted);text-decoration:none;padding:0}
.rap-steps i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.78rem;border:1px solid var(--line-strong)}
.rap-steps li.on>span{color:var(--ink);font-weight:600} .rap-steps li.on i{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rap-steps li.done i{background:var(--accent-50);color:var(--accent);border-color:var(--accent-line)}
.rap-adv{font-size:.9rem;color:var(--accent);text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.rap-main{width:100%;max-width:1000px;margin:0 auto;padding:clamp(28px,5vw,56px) clamp(16px,4vw,32px) 48px;display:grid;gap:22px;align-content:start;grid-template-columns:minmax(0,1fr)}
.rap-main h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2.1rem,5vw,3.4rem);line-height:1.05;margin:0}
.rap-main .lede{color:var(--ink-2);font-size:1.08rem;margin:-8px 0 6px}
.rap-card{border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,3vw,28px);display:grid;gap:16px;background:var(--surface)}

.pill.fict{background:var(--fict-bg);color:var(--fict)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.alert{background:var(--alert-bg);color:var(--alert)}
.pill.nv{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-strong)}
.pill.tcc{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.pill.reflink{white-space:normal;text-decoration:none;max-width:100%}
.statuslegend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.8rem;color:var(--muted);align-items:center}

/* ---------- Números e tabelas ---------- */
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,4vw,48px)}
.fig{display:grid;gap:4px;align-content:start;min-width:0}
.fig .l{font-size:.88rem;color:var(--muted)}
.fig .v{font-family:var(--f-display);font-size:clamp(1.9rem,3.2vw,2.8rem);line-height:1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.fig .v small{font-size:.48em;color:var(--muted)}
.fig .s{font-size:.82rem;color:var(--faint)}
.fig.alert .v,.fig.alert .s{color:var(--alert)}
.tablewrap{overflow-x:auto;border-top:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;white-space:nowrap}
td.r,th.r{text-align:right}
tr.alert td{background:var(--alert-bg)}
.pos{color:var(--ok)} .neg{color:var(--alert)}
.chart{display:grid;gap:10px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart figcaption{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.84rem;color:var(--faint)}
.chart .lg-row{display:flex;gap:18px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.chart .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* ---------- Linha do tempo, tarefas, cenários ---------- */
.tl{display:grid;border-left:1px solid var(--line-strong);margin-left:6px}
.tl .ev{position:relative;padding:2px 0 20px 24px;display:grid;gap:4px}
.tl .ev::before{content:"";position:absolute;left:-6px;top:7px;width:11px;height:11px;border-radius:50%;background:var(--surface);border:1.5px solid var(--faint)}
.tl .ev.chain::before{border-color:var(--info)} .tl .ev.doc::before{border-color:var(--accent)} .tl .ev.mark::before{background:var(--mark);border-color:var(--mark)}
.tl .ev.alert::before{background:var(--alert);border-color:var(--alert)}
.tl .when{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.task{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding:26px 0;border-top:1px solid var(--line)}
.task-h{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:baseline;justify-content:space-between}
.task-h h2{font-size:1.3rem;flex:1 1 300px}
.task p.why{color:var(--ink-2);max-width:70ch}
.provs{display:flex;flex-wrap:wrap;gap:8px}
.task-form{display:grid;grid-template-columns:minmax(0,170px) minmax(0,170px) minmax(0,1fr) auto;gap:12px;align-items:end}
.scenarios{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.scenario{border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:14px}
.lockbox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:start;border:1px solid var(--line);border-radius:var(--r);padding:28px}
.lockbox > .ico{width:30px;height:30px;color:var(--muted)}
.lockbox > div{display:grid;gap:12px;min-width:0}
.qcard{border:1px solid var(--line);border-radius:var(--r-sm);padding:16px;display:grid;gap:10px;min-width:0}
.qcard code{font-family:var(--f-mono);font-size:.8rem;background:var(--subtle);padding:8px 10px;border-radius:8px;overflow-wrap:anywhere;display:block;color:var(--ink-2)}
.empty{display:grid;justify-items:start;gap:12px;padding:8px 0}
.empty p{max-width:60ch;color:var(--muted)}
.strength{display:inline-flex;gap:3px;vertical-align:middle;margin-right:6px}
.strength i{width:14px;height:5px;border-radius:3px;background:var(--line-strong)}
.strength i.on{background:var(--accent)}
.juls{display:grid;gap:8px;border-left:2px solid var(--line);padding-left:14px}
.report{border:1px solid var(--line);border-radius:var(--r);padding:clamp(22px,5vw,56px);display:grid;gap:24px;min-width:0;overflow-wrap:anywhere}
.report h2{font-size:1.25rem;border-bottom:1px solid var(--line);padding-bottom:8px}
.report ul{padding-left:20px;display:grid;gap:5px}
.report > *, .report section > *{min-width:0}
.toast{position:fixed;right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:.9rem;max-width:min(440px,calc(100vw - 48px));z-index:60;display:flex;gap:10px;align-items:center;animation:entra .25s ease both}

/* ---------- Responsivo ---------- */
@media (max-width:1100px){ .home-main{grid-template-columns:minmax(0,1fr)} .seal{width:min(280px,100%)} }
@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);transform:translateX(-102%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.18)}
  body.side-open .side{transform:none}
  .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:15;opacity:0;pointer-events:none;transition:opacity .2s}
  body.side-open .scrim{opacity:1;pointer-events:auto}
  .mobilebar{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mobilebar .stepmini{font-size:.85rem;color:var(--muted)}
  .content{padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .home-steps{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:720px){
  .grid2,.grid3,.figs,.scenarios{grid-template-columns:minmax(0,1fr)}
  .kv{grid-template-columns:minmax(0,1fr)} .kv dt{margin-top:6px}
  .task-form{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .task-form .field:nth-child(3){grid-column:1/-1}
  .lockbox{grid-template-columns:minmax(0,1fr)}
  .home{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .home-steps{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}

/* ---------- Leitura de extratos ---------- */
.drop{display:grid;justify-items:center;gap:8px;padding:clamp(28px,5vw,44px) 20px;border:1.5px dashed var(--line-strong);border-radius:var(--r);background:var(--surface);text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over,.drop:focus-within{border-color:var(--accent);background:var(--accent-50)}
.drop input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.drop b{font-size:1.05rem;font-weight:600}
.drop-ico{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--accent-50);color:var(--accent)}
.drop.busy{cursor:default;grid-auto-flow:column;justify-content:center;align-items:center}
.privline{display:flex;gap:8px;align-items:center;font-size:.86rem;color:var(--muted);margin:2px 0 0}
.privline svg{color:var(--accent);flex:none}
.ext-h{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.resumo h3{font-size:.95rem;margin:0 0 8px;font-weight:600}
.achados{display:grid;border-top:1px solid var(--line)}
.achado{display:grid;gap:8px;padding:16px 4px;border-bottom:1px solid var(--line)}
.achado.inv{background:linear-gradient(90deg,var(--alert-bg),transparent 70%);padding-left:12px;border-left:3px solid var(--alert)}
.a-main{display:grid;grid-template-columns:96px minmax(0,1fr) auto auto;gap:14px;align-items:center}
.a-desc{display:grid;gap:2px;min-width:0}.a-desc b{font-weight:600;overflow-wrap:anywhere}
.a-val{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.a-meta{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;padding-left:110px}
.achado details.src{padding-left:110px}
.achado details.src summary{cursor:pointer;font-size:.8rem;color:var(--accent);width:max-content}
.achado pre,.srcpre{margin:8px 0 0;padding:10px 12px;background:var(--subtle);border-radius:8px;font-family:var(--f-mono,"IBM Plex Mono",monospace);font-size:.78rem;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink-2)}
.mini-list{display:grid;gap:0;margin-top:10px;max-height:360px;overflow:auto;border-top:1px solid var(--line)}
.mini-list>div{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:12px;padding:7px 2px;border-bottom:1px solid var(--line);font-size:.84rem}
.mini-list.mono>div{grid-template-columns:150px minmax(0,1fr);font-size:.76rem}
.mini-list>div span:nth-child(2){overflow-wrap:anywhere}
.corr-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.corr{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;display:grid;gap:4px;min-width:0}
.corr .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.corr p{margin:0;overflow-wrap:anywhere}
.g-grid{stroke:var(--line)} .g-ax{font:10px var(--f-mono,"IBM Plex Mono",monospace);fill:var(--faint)} .g-bar{fill:var(--accent)} .g-inv{fill:var(--alert)}
.g-sep{stroke:var(--ink);stroke-dasharray:3 3} .g-lab{font:10.5px var(--f-body,"Hanken Grotesk",sans-serif);fill:var(--ink)}
@media (max-width:720px){
  .a-main{grid-template-columns:minmax(0,1fr) auto;gap:6px 12px}
  .a-data{grid-column:1/-1;font-size:.8rem;color:var(--muted)}
  .a-act{grid-column:1/-1}
  .a-meta,.achado details.src{padding-left:0}
  .mini-list>div{grid-template-columns:76px minmax(0,1fr)} .mini-list>div span:nth-child(3){grid-column:2}
  .mini-list.mono>div{grid-template-columns:1fr}
}

/* ---------- Cálculo ---------- */
.res-cen{display:grid;gap:18px;min-width:0}
.res-ativo{display:grid;gap:8px}
.fig.acc .v{color:var(--accent)}
.res-ativo .fig .v{font-size:clamp(1.5rem,2.4vw,2.3rem)}
.lotes{display:grid;border-top:1px solid var(--line)}
.lote{display:grid;gap:10px;padding:18px 2px;border-bottom:1px solid var(--line)}
.lote-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.lote-h .row .pill{white-space:normal}
.lote-h>.row{margin-left:auto}
.lote-r{display:grid;gap:4px;padding-left:14px;border-left:2px solid var(--line)}
.conta{display:grid;gap:4px;background:var(--accent-50);border-radius:8px;padding:10px 12px;margin:4px 0}
.conta .mono{font-size:.82rem;overflow-wrap:anywhere}
.warn-t{color:var(--warn)}
.cot{display:grid;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.cot-h{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.cot-h .v{font-family:var(--f-display);font-size:1.5rem}
form[data-form=lote] .check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;padding-top:22px}
.scenarios .res-cen .figs{grid-template-columns:minmax(0,1fr);gap:14px}
.check input{margin-top:3px}
@media (max-width:720px){form[data-form=lote] .check{padding-top:0}}

/* ---------- Minuta ---------- */
.minuta{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(22px,5vw,56px) clamp(18px,6vw,72px);font-family:"Times New Roman",Georgia,serif;font-size:1.02rem;line-height:1.75;color:var(--ink);max-width:860px;width:100%;justify-self:center}
.minuta p{margin:0 0 14px;text-align:justify;text-indent:2em;overflow-wrap:anywhere}
.minuta .m-h1{font-weight:700;text-indent:0;text-align:left;margin-bottom:36px}
.minuta .m-h2{font-weight:700;text-indent:0;margin-top:26px}
.minuta .m-h3{font-weight:700;font-style:italic;text-indent:0;margin-top:18px}
.minuta .m-li{text-indent:0;padding-left:2em}
.minuta .m-q{margin:6px 0 4px 18%;font-size:.88rem;line-height:1.45;text-align:justify;overflow-wrap:anywhere}
.minuta .m-cit{text-indent:0;margin-left:18%;font-size:.84rem;color:var(--ink-2)}
.minuta mark{background:#FFF2A8;color:#2B2410;border-radius:3px;padding:0 2px}
:root[data-theme="dark"] .minuta mark{background:#5A4A12;color:#FFF6D6}
@media (max-width:720px){.minuta .m-q,.minuta .m-cit{margin-left:6%}}
</style>

<script>
"use strict";
/* =========================================================
   CriptoPartilha — aplicação de página única, sem backend.
   Dados: localStorage do navegador (chave cp.v1). Nada é enviado
   a servidor próprio. Consultas de blockchain vão diretamente do
   navegador à API pública escolhida (Blockstream ou mempool.space).
   ========================================================= */

/* ---------- utilidades ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2,10);
const hoje = () => new Date().toISOString().slice(0,10);
const agoraISO = () => new Date().toISOString();
const fmtData = iso => { if(!iso) return "—"; const d = new Date(iso.length===10? iso+"T12:00:00": iso); return isNaN(d)? esc(iso) : d.toLocaleDateString("pt-BR"); };
const fmtDataHora = iso => { if(!iso) return "—"; const d=new Date(iso); return isNaN(d)? esc(iso) : d.toLocaleString("pt-BR"); };
const fmtUnix = t => t ? new Date(t*1000).toLocaleString("pt-BR",{timeZone:"UTC"})+" UTC" : "sem bloco (não confirmada)";
const btc = sats => (sats/1e8).toLocaleString("pt-BR",{minimumFractionDigits:8,maximumFractionDigits:8});
const btcS = sats => (sats>0?"+":sats<0?"−":"") + btc(Math.abs(sats));
const sleep = ms => new Promise(r=>setTimeout(r,ms));
function toast(msg){ const t=$("#toast"); t.innerHTML=icon("check","sm")+"<span>"+esc(msg)+"</span>"; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,4200); }

/* ---------- validação de identificadores Bitcoin ---------- */
const B58 = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
function b58decode(s){
  let bytes=[0];
  for(const ch of s){ const v=B58.indexOf(ch); if(v<0) return null;
    let carry=v; for(let j=0;j<bytes.length;j++){ carry+=bytes[j]*58; bytes[j]=carry&255; carry>>=8; }
    while(carry){ bytes.push(carry&255); carry>>=8; } }
  for(const ch of s){ if(ch==="1") bytes.push(0); else break; }
  return Uint8Array.from(bytes.reverse());
}
async function sha256(u8){ return new Uint8Array(await crypto.subtle.digest("SHA-256",u8)); }
const BECH = "qpzry9x8gf2tvdw0s3jn54khce6mua7l";
function polymod(values){ const G=[0x3b6a57b2,0x26508e6d,0x1ea119fa,0x3d4233dd,0x2a1462b3]; let chk=1;
  for(const v of values){ const b=chk>>>25; chk=((chk&0x1ffffff)<<5)^v; for(let i=0;i<5;i++) if((b>>>i)&1) chk^=G[i]; } return chk>>>0; }
function hrpExpand(h){ const r=[]; for(const c of h) r.push(c.charCodeAt(0)>>5); r.push(0); for(const c of h) r.push(c.charCodeAt(0)&31); return r; }
function convertBits(data,from,to){ let acc=0,bits=0; const out=[]; const maxv=(1<<to)-1;
  for(const v of data){ acc=(acc<<from)|v; bits+=from; while(bits>=to){ bits-=to; out.push((acc>>bits)&maxv);} }
  if(bits>=from || ((acc<<(to-bits))&maxv)) return null; return out; }
/** Retorna {ok, tipo, rede, motivo} */
async function validarEndereco(raw){
  const a = raw.trim();
  if(!a) return {ok:false, motivo:"Informe um endereço."};
  const low = a.toLowerCase();
  if(/^(tb1|bcrt1|[mn2])/.test(low) && !/^bc1/.test(low)) {
    if(/^tb1|^bcrt1/.test(low) || /^[mn2]/.test(a)) return {ok:false, motivo:"Parece ser endereço de rede de testes (testnet/regtest). Esta versão consulta apenas a rede principal do Bitcoin."};
  }
  if(/^bc1/i.test(a)){
    if(a!==low && a!==a.toUpperCase()) return {ok:false, motivo:"Endereço bech32 com maiúsculas e minúsculas misturadas é inválido."};
    const s=low, pos=s.lastIndexOf("1"); if(pos<1||pos+7>s.length||s.length>90) return {ok:false,motivo:"Formato bech32 inválido."};
    const data=[]; for(const c of s.slice(pos+1)){ const v=BECH.indexOf(c); if(v<0) return {ok:false,motivo:"Caractere inválido no endereço."}; data.push(v); }
    const pm = polymod(hrpExpand("bc").concat(data));
    const enc = pm===1? "bech32" : pm===0x2bc830a3? "bech32m" : null;
    if(!enc) return {ok:false, motivo:"Soma de verificação (checksum) incorreta. Confira se o endereço foi copiado integralmente."};
    const ver=data[0], prog=convertBits(data.slice(1,-6),5,8);
    if(!prog||prog.length<2||prog.length>40||ver>16) return {ok:false,motivo:"Programa witness inválido."};
    if(ver===0 && enc!=="bech32") return {ok:false,motivo:"Versão 0 deve usar bech32."};
    if(ver!==0 && enc!=="bech32m") return {ok:false,motivo:"Versões 1+ devem usar bech32m."};
    if(ver===0 && prog.length!==20 && prog.length!==32) return {ok:false,motivo:"Tamanho inválido para SegWit v0."};
    const tipo = ver===0? (prog.length===20?"P2WPKH (SegWit nativo)":"P2WSH (SegWit nativo)") : ver===1&&prog.length===32? "P2TR (Taproot)" : "SegWit v"+ver;
    return {ok:true, tipo, rede:"Bitcoin (mainnet)", endereco:low};
  }
  if(/^[13][1-9A-HJ-NP-Za-km-z]{25,34}$/.test(a)){
    const by=b58decode(a); if(!by||by.length!==25) return {ok:false,motivo:"Comprimento Base58 inválido."};
    if(!(crypto&&crypto.subtle)) return {ok:true,tipo:a[0]==="1"?"P2PKH (legado)":"P2SH",rede:"Bitcoin (mainnet)",endereco:a,aviso:"Checksum não verificado (criptografia do navegador indisponível)."};
    const h=await sha256(await sha256(by.slice(0,21)));
    for(let i=0;i<4;i++) if(h[i]!==by[21+i]) return {ok:false,motivo:"Soma de verificação (checksum) incorreta. Confira se o endereço foi copiado integralmente."};
    if(by[0]===0) return {ok:true,tipo:"P2PKH (legado)",rede:"Bitcoin (mainnet)",endereco:a};
    if(by[0]===5) return {ok:true,tipo:"P2SH",rede:"Bitcoin (mainnet)",endereco:a};
    return {ok:false,motivo:"Prefixo de versão não reconhecido."};
  }
  if(/^0x[0-9a-f]{40}$/i.test(a)) return {ok:false,motivo:"Formato de endereço Ethereum/EVM. Esta versão ainda não integra essa rede (ver Limitações)."};
  if(/^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(a)) return {ok:false,motivo:"Formato de endereço Tron. Esta versão ainda não integra essa rede (ver Limitações)."};
  return {ok:false,motivo:"Não reconhecido como endereço Bitcoin da rede principal."};
}

/* ---------- provedores de blockchain (arquitetura extensível) ---------- */
const PROVEDORES = {
  blockstream: { nome:"Blockstream Esplora", api:"https://blockstream.info/api", web:"https://blockstream.info" },
  mempool:     { nome:"mempool.space (API compatível com Esplora)", api:"https://mempool.space/api", web:"https://mempool.space" }
};
/* Redes previstas na arquitetura; apenas "bitcoin" está implementada. */
const REDES = { bitcoin:{ nome:"Bitcoin", implementada:true }, ethereum:{nome:"Ethereum",implementada:false}, tron:{nome:"Tron",implementada:false} };

class ErroAPI extends Error{ constructor(tipo,msg){ super(msg); this.tipo=tipo; } }
async function apiGet(prov, path, asText=false){
  const url = PROVEDORES[prov].api + path;
  const ctl = new AbortController(); const to=setTimeout(()=>ctl.abort(),15000);
  let r;
  try{ r = await fetch(url,{signal:ctl.signal}); }
  catch(e){ clearTimeout(to);
    if(e.name==="AbortError") throw new ErroAPI("timeout","A API não respondeu em 15 segundos.");
    throw new ErroAPI("bloqueado","O navegador não conseguiu acessar a API ("+url+"). Neste ambiente a conexão direta pode estar bloqueada por política de segurança; use a importação manual abaixo ou execute o arquivo localmente.");
  }
  clearTimeout(to);
  if(r.status===400){ const t=await r.text().catch(()=> ""); throw new ErroAPI("invalido","A API recusou o identificador: "+t.slice(0,140)); }
  if(r.status===404) throw new ErroAPI("naoencontrado","Não encontrado na blockchain consultada.");
  if(r.status===429) throw new ErroAPI("limite","Limite de requisições da API atingido. Aguarde alguns minutos e tente de novo, ou troque de provedor.");
  if(!r.ok) throw new ErroAPI("indisponivel","A API respondeu com erro "+r.status+".");
  return asText? (await r.text()).trim() : r.json();
}

/* Normaliza uma transação no formato Esplora */
function normalizarTx(tx, foco){
  const vin = (tx.vin||[]).map(v => v.is_coinbase ? {addr:"(coinbase — emissão nova)", value:null, coinbase:true}
            : {addr: v.prevout?.scriptpubkey_address || ("("+(v.prevout?.scriptpubkey_type||"sem endereço")+")"), value: v.prevout?.value ?? null});
  const vout = (tx.vout||[]).map(o => ({addr: o.scriptpubkey_address || ("("+(o.scriptpubkey_type||"sem endereço")+")"), value:o.value}));
  let entrada=0, saida=0;
  if(foco){ vout.forEach(o=>{ if(o.addr===foco) entrada+=o.value; }); vin.forEach(i=>{ if(i.addr===foco && i.value) saida+=i.value; }); }
  return { txid:tx.txid, confirmada: !!tx.status?.confirmed, altura: tx.status?.block_height ?? null, tempo: tx.status?.block_time ?? null,
    taxa: tx.fee ?? null, vin, vout, entrada, saida, liquido: entrada-saida,
    totalSaidas: vout.reduce((s,o)=>s+(o.value||0),0) };
}
/* Saldo on-chain do endereço até uma data (fim do dia UTC). Só é confiável com histórico completo. */
function saldoAte(txs, dataISO){
  const lim = Date.parse(dataISO+"T23:59:59Z")/1000;
  return txs.filter(t=>t.confirmada && t.tempo<=lim).reduce((s,t)=>s+t.liquido,0);
}
/* Co-entradas: endereços que assinaram entradas junto com o endereço focal (heurística — não prova controle comum). */
function coEntradas(txs, foco){
  const m=new Map();
  txs.forEach(t=>{ if(t.vin.some(i=>i.addr===foco)) t.vin.forEach(i=>{ if(i.addr!==foco && !i.addr.startsWith("(")) m.set(i.addr,(m.get(i.addr)||0)+1); }); });
  return [...m.entries()].sort((a,b)=>b[1]-a[1]);
}
/* Interpreta JSON colado manualmente a partir de URL da API pública */
function interpretarColado(txt){
  let j; try{ j=JSON.parse(txt); }catch(e){ const n=Number(txt.trim()); if(Number.isInteger(n)&&n>0) return {tipo:"altura",dados:n}; throw new Error("O conteúdo colado não é JSON válido."); }
  if(typeof j==="number" && Number.isInteger(j) && j>0) return {tipo:"altura",dados:j};
  if(Array.isArray(j)){ if(j.length===0) return {tipo:"pagina",dados:[]}; if(j[0]&&j[0].txid&&j[0].vin) return {tipo:"pagina",dados:j}; throw new Error("Lista não reconhecida como transações no formato Esplora."); }
  if(j&&j.address&&j.chain_stats) return {tipo:"endereco",dados:j};
  if(j&&j.txid&&j.vin&&j.vout) return {tipo:"tx",dados:j};
  throw new Error("Formato não reconhecido. Cole a resposta de /address/…, /address/…/txs ou /tx/….");
}

 {id:"subrog",grupo:"Comunhão parcial: o que não se comunica",titulo:"Prova da sub-rogação",tipo:"interp",tcc:"2.4",
  texto:"A simples declaração de que usou recursos próprios não basta: é preciso demonstrar a venda do bem particular e o nexo entre essa venda e a nova aquisição (Madaleno, p. 806); para Calmon, a prova deve ser inequívoca (p. 178); para Dias, deve-se demonstrar que a compra foi feita com o produto da venda (p. 733). Se a compra foi paga em parte com recursos particulares e em parte com comuns, só a parcela sub-rogada fica fora (Lôbo, p. 291; Calmon, p. 178; Gonçalves, p. 330)."},
 {id:"valorizacao",grupo:"Comunhão parcial: o que não se comunica",titulo:"Valorização de criptoativo particular",tipo:"controv",tcc:"2.4",
  texto:"A simples alta de preço não se destaca do bem. Por analogia com a valorização de cotas sociais anteriores à união (Calmon, p. 173; Dias, p. 740), a valorização causada apenas pelo mercado tende a ficar fora da partilha. Conclusão por analogia, ainda não enfrentada especificamente pelos tribunais; o art. 1.660, VIII, proposto pelo Projeto de Lei nº 4/2025 enfraqueceria a analogia, se aprovado."},
 {id:"usopessoal",grupo:"Comunhão parcial: o que não se comunica",titulo:"Carteira de hardware e bens de uso pessoal",tipo:"interp",tcc:"2.4",
  texto:"O aparelho que guarda as chaves pode ser objeto de uso pessoal (art. 1.659, V), mas o ativo a que as chaves dão acesso tem natureza patrimonial e não se confunde com o aparelho."},

 /* Métodos do app */
 {id:"m_valor",grupo:"Métodos adotados pelo app",titulo:"Data e forma de avaliação",tipo:"interp",tcc:"4.2 e 5.1",
  texto:"Duas datas não se confundem: a separação de fato delimita o que se comunica; o valor dos bens comuns acompanha o valor de mercado na data da partilha (Calmon, p. 206). Por isso o app descreve a meação primeiro em quantidade de unidades e usa a cotação da data da partilha; a cotação da data da separação aparece apenas como referência. Toda avaliação informa data e horário, fonte da cotação, quantidade e método (Zhuang, p. 173-174)."},
 {id:"m_subrog",grupo:"Métodos adotados pelo app",titulo:"Sub-rogação parcial",tipo:"metodo",tcc:"2.4",
  texto:"Método de cálculo adotado pelo app: parcela particular = (valor pago com recursos particulares ÷ valor total pago) × quantidade adquirida. O restante da quantidade se comunica. A conta aparece na tela, e o app só aplica o método quando o nexo entre o recurso particular e a compra estiver registrado como documentado."},
 {id:"m_frutos",grupo:"Métodos adotados pelo app",titulo:"Rendimentos reinvestidos",tipo:"metodo",tcc:"2.4",
  texto:"Método de cálculo adotado pelo app: rendimentos (staking, empréstimo, airdrops proporcionais) só são calculados quando registrados como lotes separados, com data e quantidade. Quando estiverem misturados ao saldo original, o app indica \"não determinável sem perícia\", porque a partilha exigirá separar rendimento de capital anterior ao casamento."},
 {id:"m_vesperas",grupo:"Métodos adotados pelo app",titulo:"Janela de vésperas da separação de fato",tipo:"metodo",tcc:"2.4 e 4.4",
  texto:"Parâmetro sugerido pelo app, sem previsão legal: 90 dias antes da separação de fato, editável em cada caso. Saídas nesse intervalo e depois da separação são destacadas como \"movimentação a investigar\", nunca como fraude: o TCC registra que as movimentações às vésperas do rompimento merecem investigação e que nenhuma conduta técnica, como transferir para carteira própria, é ilícita por si mesma."},
 {id:"m_cenarios",grupo:"Métodos adotados pelo app",titulo:"Início da união controvertido",tipo:"metodo",tcc:"2.4",
  texto:"Quando cada parte alega uma data de início da união, o app registra as duas e apresenta os dois cenários lado a lado, sem escolher entre eles."},
 {id:"m_escopo",grupo:"Métodos adotados pelo app",titulo:"Escopo do cálculo",tipo:"metodo",tcc:"1 e 2.4",
  texto:"O cálculo aplica apenas as regras da comunhão parcial, inclusive à união estável sem contrato escrito (art. 1.725). Para outros regimes, o módulo de cálculo fica bloqueado como fora do escopo; indícios, blockchain e pedidos continuam disponíveis, porque a investigação serve a qualquer regime."},

 /* Natureza e regulação */
 {id:"natureza",grupo:"Natureza jurídica e regulação",titulo:"Natureza jurídica do criptoativo",tipo:"interp",tcc:"3.2",jul:["cc161123","resp2127038"],
  texto:"Em regra, bem móvel incorpóreo de conteúdo patrimonial: não é moeda, porque não tem curso legal, e não é crédito, porque não há devedor obrigado a pagá-lo. Quando custodiado por prestadora, o que integra o patrimônio é uma posição jurídica perante ela; quando o token representa título ou contrato de investimento coletivo, é valor mobiliário; nos investimentos irregulares, pode subsistir apenas um crédito de restituição. Essas variações não alteram a comunicabilidade, mas indicam onde estão as provas."},
 {id:"l14478",grupo:"Natureza jurídica e regulação",titulo:"Lei nº 14.478/2022",tipo:"regra",tcc:"3.3.1",url:"https://planalto.gov.br/ccivil_03/_Ato2019-2022/2022/Lei/L14478.htm",
  texto:"Define ativo virtual (art. 3º) e prestadora de serviços de ativos virtuais (art. 5º). Ao incluir as prestadoras na Lei nº 9.613/1998 (art. 9º, parágrafo único, XIX), obrigou-as a identificar clientes e manter registros das transações (art. 10 da Lei nº 9.613/1998): são esses registros que tornam útil a ordem judicial dirigida a uma corretora. A lei não cria registro público de titulares nem disciplina carteiras autocustodiadas."},
 {id:"bcb",grupo:"Natureza jurídica e regulação",titulo:"Banco Central: Resoluções BCB nº 519, 520 e 521/2025, 589/2026 e 591/2026",tipo:"regra",tcc:"3.3.2",url:"https://www.bcb.gov.br/estabilidadefinanceira/buscanormas",
  texto:"O Decreto nº 11.563/2023 atribuiu ao Banco Central a regulação das prestadoras. Resoluções em vigor desde 2 fev. 2026 impõem segregação dos ativos de clientes (Res. 520, arts. 28 e 29), conhecimento de clientes (art. 47), manutenção das informações por no mínimo cinco anos (art. 45, II) e identificação do proprietário da carteira autocustodiada nas transferências (Res. 277/2022, art. 76-A, § 5º, incluído pela Res. 521). A Res. 589/2026 veda, a partir de 6 nov. 2026, operações com prestadoras não autorizadas; a Res. 591/2026 inclui entre as comunicações obrigatórias ao COAF as transferências de ou para carteiras autocustodiadas a partir de dez mil dólares. São informações destinadas à supervisão e à inteligência financeira, obtidas pelas partes apenas por ordem judicial."},
 {id:"decripto",grupo:"Natureza jurídica e regulação",titulo:"IN RFB nº 2.291/2025 (DeCripto)",tipo:"regra",tcc:"3.3.3",url:"https://www.gov.br/receitafederal/pt-br",
  texto:"Revogou a IN RFB nº 1.888/2019 (art. 18), com efeitos desde 1º jul. 2026 (art. 19). Declaram as prestadoras residentes ou que prestem serviços no país (art. 5º, I) e os residentes que operem por prestadora estrangeira, plataforma descentralizada ou sem intermediário acima de R$ 35.000,00 mensais (art. 5º, II e § 3º). As prestadoras informam o saldo de cada usuário em 31 de dezembro (art. 7º, II). Os dados estão sob sigilo fiscal, que cede por requisição judicial (CTN, art. 198, § 1º, I). A ausência de declaração de imposto de renda tem valor probatório reduzido."},
 {id:"criptojud",grupo:"Natureza jurídica e regulação",titulo:"CriptoJud (CNJ)",tipo:"fato",tcc:"5.4",
  texto:"Lançado em 5 ago. 2025 para concentrar as ordens judiciais às prestadoras localizadas no Brasil que a ele se integrem, com implantação gradual. Não alcança carteiras autocustodiadas nem plataformas estrangeiras. O TCC registra que, em junho de 2026, juízes ainda respondiam que a ferramenta não estava disponível, e que ela não esteve disponível na unidade de família acompanhada pela autora entre setembro de 2024 e setembro de 2026. Pedidos devem prever os ofícios como alternativa."},

 /* Prova e localização */
 {id:"cpc396",grupo:"Prova e localização (CPC)",titulo:"CPC, arts. 396 e 400: exibição pelo cônjuge",tipo:"regra",tcc:"5.3",url:URL_CPC,
  texto:"O juiz pode ordenar à parte a exibição de documento ou coisa em seu poder, o que abrange extratos das prestadoras, histórico completo de operações, de preferência no formato original gerado pelas plataformas, e a indicação dos endereços das carteiras autocustodiadas. A recusa ou o silêncio levam a admitir como verdadeiros os fatos que se pretendia provar, além de medidas indutivas, coercitivas, mandamentais ou sub-rogatórias (art. 400)."},
 {id:"cpc380",grupo:"Prova e localização (CPC)",titulo:"CPC, art. 380: dever de terceiros",tipo:"regra",tcc:"5.3",url:URL_CPC,
  texto:"Impõe a quem não é parte o dever de informar ao juiz os fatos de que tenha conhecimento e de exibir coisa ou documento em seu poder. Fundamenta as requisições à Receita Federal e os ofícios às corretoras. Roteiro de Lopes Jr., adaptado à DeCripto: primeiro a Receita, para saber com quais prestadoras o titular operou; depois cada prestadora, para informar tipo, quantidade e valor, com suspensão de operações sem autorização judicial; havendo descumprimento, art. 139, IV."},
 {id:"cpc373",grupo:"Prova e localização (CPC)",titulo:"CPC, art. 373, §§ 1º e 2º: ônus da prova",tipo:"regra",tcc:"2.4 e 5.3",url:URL_CPC,
  texto:"Diante de indícios consistentes, o juiz pode atribuir ao cônjuge que administrava o patrimônio o ônus de demonstrar o destino dos recursos (Eduardo), por decisão fundamentada, de preferência no saneamento (art. 357, III). O limite do § 2º dificilmente favorece o titular, que detém chaves e registros; se alegar perda, a perda é fato que lhe cabe provar."},
 {id:"cpc401_403",grupo:"Prova e localização (CPC)",titulo:"CPC, arts. 401 a 403: exibição incidental contra terceiro",tipo:"regra",tcc:"5.3 (complemento a incluir pela autora)",url:URL_CPC,
  texto:"Segunda etapa do pedido à corretora, sugerida só quando o pedido fundado no art. 380 não for cumprido. Documento em poder de terceiro: citação para responder em 15 dias (art. 401); negada a obrigação ou a posse, audiência especial (art. 402); recusa sem justo motivo: ordem de depósito e, descumprida, apreensão, sem prejuízo de multa e outras medidas (art. 403)."},
 {id:"cpc384",grupo:"Prova e localização (CPC)",titulo:"CPC, art. 384, parágrafo único: ata notarial",tipo:"regra",tcc:"5.3",url:URL_CPC,
  texto:"Preserva indícios voláteis, como conversas, telas e arquivos eletrônicos, respeitados os limites da licitude da prova obtida no ambiente familiar."},
 {id:"cpc385",grupo:"Prova e localização (CPC)",titulo:"CPC, arts. 385, § 1º, e 386: depoimento pessoal",tipo:"regra",tcc:"5.3",url:URL_CPC,
  texto:"A parte que, intimada e advertida, se recusar a depor sujeita-se à pena de confissão, e as respostas evasivas serão valoradas na sentença."},
 {id:"cpc139",grupo:"Prova e localização (CPC)",titulo:"CPC, art. 139, IV: medidas atípicas",tipo:"regra",tcc:"5.4",url:URL_CPC,jul:["adi5941"],
  texto:"Diante de indícios de criptoativos em carteira autocustodiada, o juiz pode ordenar ao titular que os transfira para conta em prestadora autorizada, com bloqueio até a partilha, sob multa (art. 537), ou que demonstre o controle dos endereços por assinatura digital, sem revelar a chave privada. É a resposta à cautela de Calmon contra ordens que exijam a entrega das chaves. O descumprimento pode configurar ato atentatório à dignidade da justiça (art. 77, IV e § 2º)."},
 {id:"cpc300",grupo:"Prova e localização (CPC)",titulo:"CPC, arts. 300 e 301: tutela cautelar",tipo:"regra",tcc:"4.4",url:URL_CPC,
  texto:"O risco de dilapidação por quem fica com a posse dos bens comuns autoriza arrolamento e indisponibilidade, além de pedidos de movimentação bancária e declarações de imposto de renda (Dias, p. 753-754). Nos criptoativos, a eficácia depende de o ativo estar identificado e sob a guarda de alguém que possa ser obrigado a cumprir a ordem."},
 {id:"declaracao",grupo:"Prova e localização (CPC)",titulo:"Declaração patrimonial detalhada",tipo:"estrategia",tcc:"5.1",
  texto:"Proposta de Eduardo: exigir das partes declaração com menção expressa a criptoativos, plataformas utilizadas e endereços de carteira conhecidos, sob compromisso de veracidade, com base nos deveres de boa-fé e cooperação (CPC, arts. 5º e 6º); a omissão dolosa pode configurar litigância de má-fé (art. 80). A declaração fixa uma versão dos fatos, e o ativo descoberto depois vira contradição documentada."},
 {id:"incidente",grupo:"Prova e localização (CPC)",titulo:"Incidente de identificação de bens digitais",tipo:"estrategia",tcc:"5.4",jul:["resp2124424"],
  texto:"Transposto para o divórcio, o modelo do inventário serve para organizar a investigação em procedimento paralelo (requisições, perícia de blockchain e avaliação), preservando a partilha dos demais bens. O TCC recomenda prudência na transposição."},
 {id:"cpc190",grupo:"Prova e localização (CPC)",titulo:"CPC, arts. 190 e 694: soluções consensuais",tipo:"estrategia",tcc:"5.4",url:URL_CPC,
  texto:"As partes podem convencionar o perito, a plataforma de referência da cotação, a data e o horário de apuração e se a divisão será em espécie ou pelo valor; nas ações de família, a mediação pode contar com apoio técnico."},
 {id:"limites",grupo:"Prova e localização (CPC)",titulo:"Limites: intimidade, LGPD e licitude da prova",tipo:"regra",tcc:"5.3",

 {id:"desconsideracao",grupo:"Ocultação e fraude à meação",titulo:"Desconsideração inversa: CPC, art. 133, § 2º",tipo:"regra",tcc:"4.4",url:URL_CPC,jul:["agint1243409"],

 {id:"jur_busca",grupo:"Jurisprudência sobre busca de criptoativos",titulo:"Padrão de indícios para ofícios às corretoras",tipo:"interp",tcc:"3.4",jul:["tjsp2202157","tjsp2212988","tjdft0713204","tjdft0713582","tjsp2225716","resp2127038","tjsp2343909"],

  1:{nome:"Só referência pública", curto:"a página existe; a ligação ainda não foi examinada", nivel:1, cls:"k1", tecnico:"Referência pública localizada", desc:"Informação encontrada em fonte acessível; a relação com a pessoa ainda precisa ser examinada."},

/* ---------- estado ----------
   Os casos ficam na memória da página. Só vão para o armazenamento do navegador quando o usuário
   clica em "Salvar neste navegador". Nada é gravado automaticamente: o tema escuro e a ajuda
   aberta valem só enquanto a página está aberta, e o app sempre abre no tema claro. */
const CHAVE="cp.v1";
const REGIMES_NO_ESCOPO = new Set(["comunhao_parcial","uniao_estavel_sem_contrato"]);
let memoriaApenas=false;
let alterado=false;          // há mudanças em casos reais ainda não salvas
let S = null;
S = carregar();
function carregar(){
  let s=null;
  try{ const raw=localStorage.getItem(CHAVE); if(raw){ const j=JSON.parse(raw); if(j&&Array.isArray(j.casos)) s=j; } }catch(e){ memoriaApenas=true; }
  if(!s) return { casos:[], ativo:null, provedor:"blockstream", guia:null, salvoEm:null };
  // migração de versões anteriores (que salvavam automaticamente)
  s.casos = s.casos.filter(c=>!c.ficticio).map(migrarCaso);
  if(!s.casos.some(c=>c.id===s.ativo)) s.ativo=null;
  return s;
}
function migrarCaso(c){
  const base = novoCaso();
  const m = Object.assign({}, base, c);
  m.inicial = Object.assign({}, base.inicial, c.inicial||{});
  const mapa = {exibicao_terceiro:"corretoras", oficios:"corretoras", fiscal:"receita"};
  const pv = {}; Object.entries(c.providencias||{}).forEach(([k,v])=>{ const n=mapa[k]||k; pv[n]=Object.assign({}, pv[n]||{}, v); }); m.providencias=pv;
  return m;
}
/* Chamado depois de qualquer alteração: marca como não salvo. Não grava nada. */
function salvar(){ const c=casoAtivo(); if(!c || !c.ficticio) alterado=true; atualizarStatus(); }
function persistir(){

  cenariosInicio(c).forEach(x=>ev.push({d:x.data, k:"mark", t:x.rotulo, s:REGIMES[i.regime]||""}));
  if(i.dataSeparacao && Number(i.janelaDias)>0){ const dj=new Date(new Date(i.dataSeparacao+"T12:00:00").getTime()-Number(i.janelaDias)*864e5).toISOString().slice(0,10); ev.push({d:dj, k:"mark", t:`Início da janela de vésperas (${i.janelaDias} dias)`, s:"Parâmetro sugerido pelo app, sem previsão legal."}); }
  if(i.dataSeparacao) ev.push({d:i.dataSeparacao, k:"mark", t:"Separação de fato (informada)", s:""});
  c.evidencias.forEach(e=>{ if(!e.data) return;
    const t = e.achado? (e.achado.categoria==="banco"? `Possível operação com criptoativo no banco: ${brl(Math.abs(e.achado.valor))} (indício mais fraco)` : `${e.achado.sentido==="recebido"?"Recebido de":"Enviado a"} ${e.achado.corretora}: ${brl(Math.abs(e.achado.valor))} (extrato)${e.achado.faixa==="janela"||e.achado.faixa==="apos"?" · movimentação a investigar":""}`)
      : (TIPOS_EVID[e.tipo]||"Documento")+(e.ref?" — "+e.ref:"");
    ev.push({d:e.data, k:"doc", t, s:e.descricao, fict:e.ficticio}); });
  (c.lotes||[]).forEach(L=>{ if(L.data) ev.push({d:L.data, k:"doc", t:`Lote do cálculo: ${fmtQ(L.quantidade,L.ativo)} (${FORMAS[L.forma].toLowerCase()})`, s:L.obs||"", fict:L.ficticio}); });
  c.consultas.forEach(q=>{
    const lista = q.tipo==="endereco"? q.txs : [q.tx];
    lista.forEach(t=>{ if(!t) return; const d=t.tempo? new Date(t.tempo*1000).toISOString().slice(0,10) : null; if(!d) return;
      ev.push({d, k:"chain", t: q.simulado? `${t.liquido<0?"Saída":"Entrada"} simulada de ${btcS(t.liquido)} BTC na carteira fictícia` : `Transação ${t.txid.slice(0,10)}… ${q.tipo==="endereco"?"("+btcS(t.liquido)+" BTC no endereço "+(q.alvoRotulo||q.alvo).slice(0,8)+"…)":"("+btc(t.totalSaidas)+" BTC em saídas)"}`, s:q.simulado?"Dados simulados para demonstração":"Registro on-chain consultado em "+fmtDataHora(q.em), demo:q.demo, txid:t.txid, prov:q.provedor}); });
  });
  ev.sort((a,b)=>a.d.localeCompare(b.d));
  return ev;
}
const naConvivencia = (c,d) => { const cen=cenariosInicio(c); if(!cen.length) return null; const sep=c.inicial.dataSeparacao;

const passoDaRota = r => PASSOS.find(p=>p.tabs.some(t=>t[0]===r)) || null;
let ajudaAberta = null;

function progresso(c){
  const i=c.inicial;
  return [ !!(i.regime && cenariosInicio(c).length && c.objetivo),
    c.evidencias.length>0 || c.enderecos.length>0 || c.fontes.length>0,
    c.consultas.length>0,
    !noEscopo(c) || (c.lotes||[]).length>0,
    Object.keys(c.lacunas).length>0 || Object.values(c.providencias).some(p=>p&&p.marcada),
    !!c.relatorioEm ];
}
function proximoPasso(c){ const p=progresso(c); const i=p.findIndex(x=>!x); return i<0? null : PASSOS[i]; }

const SELO = "Os extratos e documentos são lidos apenas neste navegador, sem envio a servidores nem a inteligência artificial. As consultas à blockchain enviam ao provedor apenas o endereço ou hash consultado, e as de cotação, apenas o ativo e a data. Nada fica salvo sem você pedir.";

const AJUDA = {
  caso:"Informe o regime de bens e as datas que delimitam a comunhão. Se o início da união for controvertido, registre a data alegada por cada parte: o app mostra os dois cenários. Exemplo: compras de bitcoin em 2019 podem cair dentro da comunhão num cenário e fora no outro.",
  evidencias:"Carregue o extrato em CSV, OFX ou PDF com texto: o app procura transferências para corretoras pelo CNPJ e pelo nome, e palavras como BITCOIN em operações do próprio banco, mostrando a linha de onde veio cada achado. O arquivo é lido só neste navegador e não é guardado; em PDF, o leitor de PDF é baixado da internet na primeira leitura, mas o extrato não sai do navegador. Registre no caso os achados e os demais documentos: um PIX para uma corretora mostra a saída de dinheiro, não a compra de criptoativo.",
  pesquisa:"O app monta buscas a partir do nome e dos endereços do caso; elas abrem em nova aba e o CPF nunca é usado. Registre o que encontrar e diga quão forte é a ligação com a pessoa. Coincidência de nome, sozinha, não demonstra identidade.",
  blockchain:"Cole um endereço Bitcoin ou o hash de uma transação e consulte. O gráfico mostra o saldo do endereço no tempo e destaca as saídas na janela antes da separação e depois dela. A blockchain mostra movimentações, não quem controla o endereço (TCC, 3.1).",

  calculo:"Registre cada lote com data, quantidade, valor pago e origem dos recursos: o app aplica as regras de comunicabilidade do TCC e mostra a regra, a base e, na sub-rogação parcial, a conta. A meação sai em unidades e é avaliada pela cotação da data da partilha, buscada em API pública ou informada à mão com a fonte. Se o início da união for controvertido, os dois cenários aparecem lado a lado.",
  lacunas:"Cada tarefa diz o que falta demonstrar e quais pedidos podem supri-la. A situação inicial é uma sugestão; conclua uma tarefa apenas quando houver documento nos autos. Use Incluir para levar o pedido à lista de pedidos.",
  providencias:"Pedidos na ordem sugerida pelo TCC: preservar indícios, exigir do cônjuge, requisitar a terceiros, periciar e extrair consequências da recusa. Marque os que pretende formular: eles vão para o relatório e para a minuta. O ofício à corretora tem como fundamento o art. 380 do CPC e, se não for cumprido, o app sugere a exibição incidental contra terceiro.",
  minuta:"Reúne os pedidos marcados numa minuta de petição, na ordem sugerida pelo TCC, com os indícios registrados e os fundamentos de cada pedido. Os julgados entram com a ementa exatamente como transcrita no TCC; diligências sem julgado no TCC ficam só com a fundamentação legal. Baixe para editar no Word e preencha os trechos entre colchetes.",

};
function cabecalho(eyebrow, titulo, lede, acoes=""){
  const r=rotaAtual(); const h=AJUDA[r];
  return `<div class="head"><div class="titles"><span class="eyebrow">${esc(eyebrow)}</span><h1>${titulo}</h1>${lede?`<p class="lede">${lede}</p>`:""}</div>
    <div class="actions">${acoes}${h?`<button class="helpbtn" data-act="ajuda" aria-expanded="${ajudaAberta===r}"><span class="q">?</span>${ajudaAberta===r?"Fechar ajuda":"Como usar"}</button>`:""}</div></div>
    ${h&&ajudaAberta===r?`<div class="helpbox"><p>${esc(h)}</p></div>`:""}`;
}
function abas(c){
  const r=rotaAtual(); const p=passoDaRota(r); if(!p||p.tabs.length<2) return "";
  const cnt = {evidencias:c?c.evidencias.length+c.enderecos.length:0, pesquisa:c?c.fontes.length:0, blockchain:c?c.consultas.length:0, lacunas:c?lacunasAbertas(c):0, providencias:c?Object.values(c.providencias).filter(x=>x&&x.marcada).length:0};
  return `<nav class="tabs" aria-label="Seções de ${esc(p.t)}">${p.tabs.map(([id,t])=>`<a href="#${id}" ${id===r?'aria-current="page"':""}>${esc(t)}${cnt[id]?`<span class="cnt">${cnt[id]}</span>`:""}</a>`).join("")}</nav>`;
}
function navegacaoPassos(c){
  const p=passoDaRota(rotaAtual()); if(!p) return "";
  const ant=PASSOS[p.n-2], prox=PASSOS[p.n];
  return `<div class="next">${ant?`<a class="btn ghost" href="#${ant.tabs[0][0]}">← ${esc(ant.t)}</a>`:"<span></span>"}${prox?`<a class="btn" href="#${prox.tabs[0][0]}">Continuar: ${esc(prox.t)} →</a>`:""}</div>`;
}
function atualizarStatus(){ const el=$("#saveRow"); if(el) el.outerHTML=statusSalvar(); }
function statusSalvar(){
  const c=casoAtivo(); if(!c) return `<div class="save-row" id="saveRow"></div>`;
  if(c.ficticio) return `<div class="save-row" id="saveRow"><span><span class="dot"></span>Demonstração: não é salva</span></div>`;
  if(alterado) return `<div class="save-row" id="saveRow"><span><span class="dot warn"></span>Alterações não salvas</span><button class="sm pri" data-act="salvarNavegador">Salvar</button></div>`;
  if(S.salvoEm) return `<div class="save-row" id="saveRow"><span title="${esc(fmtDataHora(S.salvoEm))}"><span class="dot ok"></span>Salvo neste navegador</span></div>`;
  return `<div class="save-row" id="saveRow"><span><span class="dot"></span>Ainda não salvo</span><button class="sm" data-act="salvarNavegador">Salvar</button></div>`;
}

    <a class="brand" href="#inicio">${LOGO(32)}<b>CriptoPartilha</b></a>

      <select id="casoAtivo"><option value="">Nenhum caso</option>${S.casos.map(k=>`<option value="${k.id}" ${k.id===S.ativo?"selected":""}>${esc(k.codigo)}${k.ficticio?" · demonstração":""}</option>`).join("")}</select>
      ${statusSalvar()}</div>
    <ol class="steps">${PASSOS.map((s,i)=>{ const on=atual&&atual.n===s.n; const off=!c && s.id!=="blockchain";

  </aside>`;

/* ----- utilidades de texto, número e data ----- */
const normT = s => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/\s+/g," ").trim();
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const soDigitos = s => String(s||"").replace(/\D/g,"");
const fmtCNPJ = d => d.length===14 ? `${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5,8)}/${d.slice(8,12)}-${d.slice(12)}` : d;
const brl = n => (n==null||!isFinite(n)) ? "—" : n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
function cnpjValido(v){
  const d=soDigitos(v); if(d.length!==14 || /^(\d)\1+$/.test(d)) return false;
  const calc = n => { const pesos = n===12? [5,4,3,2,9,8,7,6,5,4,3,2] : [6,5,4,3,2,9,8,7,6,5,4,3,2]; const s=pesos.reduce((a,p,i)=>a+ +d[i]*p,0); const r=s%11; return r<2?0:11-r; };
  return calc(12)===+d[12] && calc(13)===+d[13];
}
function parseValorBR(raw){
  if(raw==null) return null; let s=String(raw).trim(); if(!s) return null;
  let neg=false;
  if(/^\(.*\)$/.test(s)){ neg=true; s=s.slice(1,-1); }
  s=s.replace(/R\$/gi,"").replace(/\s+/g,"");
  if(/[Dd]$/.test(s)){ neg=true; s=s.slice(0,-1); } else if(/[Cc]$/.test(s)) s=s.slice(0,-1);
  if(/[-−–]$/.test(s)){ neg=true; s=s.slice(0,-1); }
  if(/^[-−–]/.test(s)){ neg=true; s=s.slice(1); }
  if(/^\+/.test(s)) s=s.slice(1);
  if(!/^\d[\d.,]*$/.test(s)) return null;
  const lc=s.lastIndexOf(","), ld=s.lastIndexOf(".");
  let n;
  if(lc>=0 && ld>=0) n = lc>ld ? +s.replace(/\./g,"").replace(",",".") : +s.replace(/,/g,"");
  else if(lc>=0) n = +s.replace(/,/g,".").replace(/\.(?=.*\.)/g,"");
  else if(ld>=0) n = /^\d{1,3}(\.\d{3})+$/.test(s) ? +s.replace(/\./g,"") : +s;
  else n = +s;
  if(!isFinite(n)) return null;
  return neg ? -n : n;
}
const MESES_PT = {JAN:1,FEV:2,MAR:3,ABR:4,MAI:5,JUN:6,JUL:7,AGO:8,SET:9,OUT:10,NOV:11,DEZ:12};
function isoValida(a,m,d){ if(m<1||m>12||d<1||d>31||a<1990||a>2100) return null; const dt=new Date(Date.UTC(a,m-1,d)); if(dt.getUTCDate()!==d) return null; return `${a}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`; }
/* Devolve {iso, inferido, len} ou null. len = tamanho do trecho reconhecido no início. */
function parseDataBR(raw, anoPadrao){
  const s=normT(raw); let m;
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))) { const iso=isoValida(+m[1],+m[2],+m[3]); return iso&&{iso,inferido:false,len:m[0].length}; }
  if((m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4}|\d{2})(?!\d)/))) { let a=+m[3]; if(m[3].length===2) a+=2000; const iso=isoValida(a,+m[2],+m[1]); return iso&&{iso,inferido:false,len:m[0].length}; }
  if((m=s.match(/^(\d{1,2}) ?(?:DE )?(JAN|FEV|MAR|ABR|MAI|JUN|JUL|AGO|SET|OUT|NOV|DEZ)[A-Z]*\.?(?: ?(?:DE )?(\d{4}))?(?![A-Z])/))) {
    const a=m[3]? +m[3] : anoPadrao; if(!a) return null; const iso=isoValida(a,MESES_PT[m[2]],+m[1]); return iso&&{iso,inferido:!m[3],len:m[0].length}; }
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})(?![\/\d])/))) { if(!anoPadrao) return null; const iso=isoValida(anoPadrao,+m[2],+m[1]); return iso&&{iso,inferido:true,len:m[0].length}; }
  if((m=s.match(/^(\d{4})(\d{2})(\d{2})/))) { const iso=isoValida(+m[1],+m[2],+m[3]); return iso&&{iso,inferido:false,len:8}; }
  return null;
}
function anoMaisFrequente(texto){
  const cont={}; (String(texto).match(/(?<!\d)20\d{2}(?!\d)/g)||[]).forEach(a=>{ if(+a>=2000&&+a<=2100) cont[a]=(cont[a]||0)+1; });
  const top=Object.entries(cont).sort((a,b)=>b[1]-a[1])[0]; return top? +top[0] : null;
}
const RE_SALDO = /^(SALDO|SDO)\b|SALDO (ANTERIOR|DO DIA|FINAL|EM C|DISPONIVEL|BLOQUEADO|TOTAL)|^S A L D O/;
function tipoOperacao(t){
  const s=normT(t);
  if(/\bPIX\b/.test(s)) return "PIX";
  if(/\bTED\b/.test(s)) return "TED";
  if(/\bDOC\b/.test(s)) return "DOC";
  if(/TRANSF|\bTEF\b|TRANSFERENCIA/.test(s)) return "Transferência";
  if(/BOLETO|PAGTO|PAGAMENTO|PGTO/.test(s)) return "Pagamento";
  if(/CARTAO|COMPRA|DEBITO AUTOMATICO/.test(s)) return "Cartão ou compra";
  if(/SAQUE/.test(s)) return "Saque";
  if(/DEPOSITO/.test(s)) return "Depósito";
  return "Outro";
}
function sinalPorPalavra(t){
  const s=normT(t);
  if(/ENVIAD|\bENVIO\b|\bDEBITO\b|\bDEB\b|PAGAMENTO|PAGTO|PGTO|SAQUE|TRANSF\w* ENV|EMITID|COMPRA|APLICACAO/.test(s)) return -1;
  if(/RECEBID|\bCREDITO\b|\bCRED\b|DEPOSITO|ESTORNO|RESGATE|DEVOLU/.test(s)) return 1;
  return 0;
}
/* Tira do histórico os termos de operação, datas, valores e CNPJ, para mostrar o favorecido. */
function favorecidoDe(desc){
  const partes=String(desc||"").split(" · ");
  for(const p of partes){ const f=limpaFavorecido(p); if(f) return f; }
  return "não identificado no histórico";
}
function limpaFavorecido(s){
  s=s.replace(/\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}/g," ")
     .replace(/(?:R\$\s?)?[-−]?\d{1,3}(?:\.\d{3})*,\d{2}[-DC]?/g," ")
     .replace(/\b\d{1,2}\/\d{1,2}(?:\/\d{2,4})?\b/g," ")
     .replace(/\b(CNPJ|CPF)\b:?/gi," ").replace(/[|;*#]+/g," ").replace(/\s+/g," ").trim();
  const lead=/^(PIX|TED|DOC|TEF|TRANSF\w*|TRANSFER[EÊ]NCIA|ENVIAD[OA]|RECEBID[OA]|ENVIO|EMITID[OA]|PAGAMENTO|PAGTO|PGTO|PARA|DE|QR ?CODE|CHAVE|INTERNET|INTERBANC[AÁ]RIA|ELETR[OÔ]NICA|PELO|NO|NA|DEST|FAV|FAVORECIDO|ORIGEM)\b[\s:.\-–]*/i;
  let prev; do{ prev=s; s=s.replace(lead,""); }while(s!==prev && s);
  s=s.replace(/[\s:.\-–]+$/,"").trim();
  return /[A-Za-zÀ-ú]{2}/.test(s)? s : "";
}

/* ----- identificação da corretora ----- */
function identificarCorretora(texto, lista){
  const s=normT(texto);
  const cnpjsNaLinha=(String(texto).match(/\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}/g)||[]).map(soDigitos);
  const raizes=(String(texto).match(/(?<!\d)\d{2}\.\d{3}\.\d{3}(?![\d.])/g)||[]).map(soDigitos);
  for(const c of lista){
    for(const k of (c.cnpjs||[])){
      if(cnpjsNaLinha.includes(k.cnpj)) return {corretora:c, por:"cnpj", regra:`CNPJ ${fmtCNPJ(k.cnpj)} (${k.razao})`, cnpjRef:k};
      if(raizes.includes(k.cnpj.slice(0,8))) return {corretora:c, por:"cnpj", regra:`raiz do CNPJ ${fmtCNPJ(k.cnpj).slice(0,10)} (${k.razao})`, cnpjRef:k};
    }
  }
  for(const c of lista){
    for(const t of (c.termos||[])){
      const tn=normT(t); if(tn.length<3) continue;
      if(new RegExp("(^|[^A-Z0-9])"+escRe(tn)+"(?=[^A-Z0-9]|$)").test(s)) return {corretora:c, por:"nome", regra:`nome contém "${tn}"`};
    }
  }
  return null;
}

/* ----- possível operação com criptoativo no próprio banco (indício mais fraco) -----
   Palavras longas (BITCOIN, ETHEREUM, CRIPTOMOEDA…) bastam quando o lançamento não é transferência a terceiro.
   Siglas curtas (BTC, ETH, USDT, USDC) só contam com palavra de operação (COMPRA, VENDA, RESGATE…).
   Não conta quando a palavra está no nome de favorecido de PIX/TED, em nome de empresa (LTDA, ME, EIRELI, S.A.)
   ou em compra com cartão, para evitar falsos positivos como "BITCOIN BURGUER LTDA". */
const CRIPTO_LONGAS = /(?:^|[^A-Z0-9])(BITCOINS?|ETHEREUM|ETHER|CRIPTOMOEDAS?|CRIPTOATIVOS?|CRIPTO|CRYPTO|STABLECOINS?|TETHER|SATOSHIS?)(?=[^A-Z0-9]|$)/;
const CRIPTO_SIGLAS = /(?:^|[^A-Z0-9])(BTC|ETH|USDT|USDC)(?=[^A-Z0-9]|$)/;
const CRIPTO_OPERACAO = /(?:^|[^A-Z0-9])(COMPRA|VENDA|VENDIDO|COMPRADO|RESGATE|APLICACAO|APLIC|INVESTIMENTO|INVEST|CONVERSAO|CONVERTIDO|TROCA|CUSTODIA|CRIPTO|CRIPTOMOEDAS?|CRIPTOATIVOS?)(?=[^A-Z0-9]|$)/;
const TRANSF_TERCEIRO = /(?:^|[^A-Z0-9])(PIX|TED|DOC|TEF|TRANSF\w*|TRANSFERENCIA|BOLETO)(?=[^A-Z0-9]|$)/;
const NOME_EMPRESA = /(?:^|[^A-Z0-9])(LTDA|ME|EPP|EIRELI|S\/?A|CIA|MEI|COMERCIO|RESTAURANTE|LANCHONETE|BURGUER|BURGER|TRANSPORTES)(?=[^A-Z0-9]|$)/;
function palavraCripto(texto){
  const s=normT(texto);
  if(/(?:^|[^A-Z0-9])CARTAO(?=[^A-Z0-9]|$)/.test(s) || NOME_EMPRESA.test(s)) return null;
  const longa=s.match(CRIPTO_LONGAS), sigla=s.match(CRIPTO_SIGLAS);
  if(!longa && !sigla) return null;
  const palavra=(longa||sigla)[1];

function erroExt(msg, extra){ const e=new Error(msg); Object.assign(e, extra||{}); return e; }
function splitCSV(line, d){ const out=[]; let cur="", q=false;

    if(q){ if(ch==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; }
    else if(ch==='"') q=true; else if(ch===d){ out.push(cur); cur=""; } else cur+=ch; }
  out.push(cur); return out.map(x=>x.trim()); }
function lerCSV(texto){
  const linhas=String(texto).replace(/^\uFEFF/,"").split(/\r\n|\n|\r/);
  const amostra=linhas.filter(l=>l.trim()).slice(0,40);
  const delims=[";","\t",","]; let delim=";", melhor=-1;
  for(const d of delims){ const cont=amostra.map(l=>splitCSV(l,d).length-1).filter(n=>n>0); const sc=cont.length? cont.length*Math.min(...cont) : 0; if(sc>melhor){ melhor=sc; delim=d; } }
  const ano=anoMaisFrequente(texto);
  let cab=-1, cols=null;
  for(let i=0;i<Math.min(linhas.length,30);i++){
    const cel=splitCSV(linhas[i],delim).map(normT);
    if(cel.some(x=>/^(DATA|DATE|DT)\b/.test(x)) && cel.some(x=>/VALOR|AMOUNT|DEBITO|CREDITO|QUANTIA|MONTANTE|ENTRADA|SAIDA/.test(x))){
      const idx = re => cel.findIndex(x=>re.test(x) && !/SALDO/.test(x));
      cols={ data: cel.findIndex(x=>/^(DATA|DATE|DT)\b/.test(x)), valor: idx(/^(VALOR|AMOUNT|QUANTIA|MONTANTE)/), deb: idx(/DEBITO|SAIDA/), cred: idx(/CREDITO|ENTRADA/),
        desc: cel.map((x,j)=>/HIST|DESCRI|LANCAMENTO|DETALH|MEMO|FAVORECID|NOME|ESTABELEC|TITULO|DESTINAT|ORIGEM|COMPLEMENTO|BENEFICI/.test(x)?j:-1).filter(j=>j>=0) };
      if(!cols.desc.length) cols.desc = cel.map((x,j)=>j).filter(j=>j!==cols.data && j!==cols.valor && j!==cols.deb && j!==cols.cred && !/SALDO|DOC|NUMERO/.test(cel[j]));
      cab=i; break;
    }
  }
  const lanc=[], ignoradas=[];
  for(let i=cab+1;i<linhas.length;i++){
    const bruto=linhas[i]; if(!bruto.trim()) continue;
    const cel=splitCSV(bruto,delim);
    let data=null, valor=null, desc="";
    if(cols){
      data=parseDataBR(cel[cols.data]||"", ano);
      if(cols.valor>=0) valor=parseValorBR(cel[cols.valor]);
      else { const cr=cols.cred>=0? parseValorBR(cel[cols.cred]) : null; const db=cols.deb>=0? parseValorBR(cel[cols.deb]) : null;
        if(cr) valor=Math.abs(cr); else if(db) valor=-Math.abs(db); }
      desc=cols.desc.map(j=>cel[j]||"").filter(Boolean).join(" · ");
    } else {
      const jd=cel.findIndex(x=>parseDataBR(x,ano)); if(jd>=0) data=parseDataBR(cel[jd],ano);
      const nums=cel.map((x,j)=>({j,v:/[.,]\d{2}\s?[-DC]?$/.test(x)? parseValorBR(x):null})).filter(o=>o.v!=null && o.j!==jd);
      if(nums.length) valor=nums[0].v;
      desc=cel.filter((x,j)=>j!==jd && !nums.some(o=>o.j===j)).sort((a,b)=>b.length-a.length)[0]||"";
    }
    if(!data || valor==null){ ignoradas.push({ref:`linha ${i+1}`, texto:bruto}); continue; }
    if(RE_SALDO.test(normT(desc))) continue;
    lanc.push({ref:`linha ${i+1}`, data:data.iso, anoInferido:data.inferido, valor, sinalIncerto:false, desc, bruto});
  }
  if(!lanc.length) throw erroExt("Não encontrei lançamentos com data e valor neste CSV. Confira se é o extrato da conta (e não um resumo) ou tente o formato OFX.");
  return {formato:"CSV", lancamentos:lanc, ignoradas, avisos: lanc.some(l=>l.anoInferido)? [`Algumas datas não tinham ano; usei ${ano}, o ano que mais aparece no arquivo.`] : []};
}
function lerOFX(texto){
  const t=String(texto); const lanc=[], ignoradas=[];
  const re=/<STMTTRN>([\s\S]*?)(?:<\/STMTTRN>|(?=<STMTTRN>)|(?=<\/BANKTRANLIST>))/gi; let m;
  const campo=(b,tag)=>{ const r=b.match(new RegExp("<"+tag+">([^<\\r\\n]*)","i")); return r? r[1].trim() : ""; };
  while((m=re.exec(t))){
    const b=m[1]; const linha=t.slice(0,m.index).split(/\r\n|\n|\r/).length;
    const dt=campo(b,"DTPOSTED"), amt=campo(b,"TRNAMT"), nome=campo(b,"NAME"), memo=campo(b,"MEMO"), tipo=campo(b,"TRNTYPE");
    const data=parseDataBR(dt); const valor=amt? parseFloat(amt.replace(",",".")) : NaN;
    const bruto=["TRNTYPE","DTPOSTED","TRNAMT","FITID","CHECKNUM","NAME","MEMO"].map(k=>{ const v=campo(b,k); return v? `<${k}>${v}` : ""; }).filter(Boolean).join(" ");
    if(!data || !isFinite(valor)){ ignoradas.push({ref:`linha ${linha}`, texto:bruto}); continue; }
    const desc=[nome,memo].filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i).join(" · ") || tipo;
    if(RE_SALDO.test(normT(desc))) continue;
    lanc.push({ref:`linha ${linha}`, data:data.iso, anoInferido:false, valor, sinalIncerto:false, desc, bruto});
  }
  if(!lanc.length) throw erroExt("Não encontrei lançamentos (<STMTTRN>) neste OFX.");
  return {formato:"OFX", lancamentos:lanc, ignoradas, avisos:[]};
}
/* Linhas de texto (de PDF ou TXT) → lançamentos. Cada linha: {pag, n, texto}. */
const RE_DINHEIRO = /(?:R\$\s?)?\(?[-−]?\s?\d{1,3}(?:\.\d{3})*,\d{2}\)?(?:\s?[DC](?![A-Za-z])|-(?!\d))?/g;
function lerLinhasTexto(linhas, textoTodo){
  const ano=anoMaisFrequente(textoTodo); const lanc=[], ignoradas=[]; let dataAtual=null, ultimo=null, ultimoIdx=-9, anoCtx=null;
  linhas.forEach((ln,idx)=>{
    const tx=ln.texto.trim(); if(!tx) return;
    /* Cabeçalhos com ano ("ANO 2024", "Período: 01/02/2023 a ...", "MARÇO 2024") definem o ano das datas sem ano que vêm abaixo. */
    if(!RE_DINHEIRO.test(tx) || !/^\d/.test(tx)){ RE_DINHEIRO.lastIndex=0; const my=tx.match(/(?<!\d)(20\d{2})(?!\d)/); if(my && !/^\d{1,2}[\/.-]\d{1,2}/.test(tx)) anoCtx=+my[1]; }
    RE_DINHEIRO.lastIndex=0;
    const d=parseDataBR(tx, anoCtx||ano);
    let resto = d? tx.slice(d.len).trim() : tx;
    if(d) dataAtual=d;
    const vals=[...resto.matchAll(RE_DINHEIRO)].map(x=>x[0]);
    const ref = `pág. ${ln.pag}, linha ${ln.n}`;
    if(vals.length && dataAtual){
      const desc=resto.replace(RE_DINHEIRO," ").replace(/\s+/g," ").trim();
      if(RE_SALDO.test(normT(desc))){ ultimo=null; return; }
      let valor=parseValorBR(vals[0]); let incerto=false;
      const temMarca=/[-−(]|[DC]$|-$/.test(vals[0].replace(/\s/g,""));
      if(!temMarca){ const sp=sinalPorPalavra(desc); if(sp) valor=Math.abs(valor)*sp; else incerto=true; }
      ultimo={ref, data:dataAtual.iso, anoInferido:dataAtual.inferido, valor, sinalIncerto:incerto, desc, bruto:tx};
      lanc.push(ultimo); ultimoIdx=idx; return;
    }
    if(ultimo && !d && idx-ultimoIdx<=2 && !vals.length && !/^(PAGINA|PAG\.|EXTRATO|AGENCIA|CONTA|PERIODO|DATA|HISTORICO|LANCAMENTOS)/.test(normT(tx))){
      ultimo.desc += " · "+tx; ultimo.bruto += "\n"+tx; ultimo.ref = ultimo.ref.replace(/linha (\d+)(?:–\d+)?$/, (_,a)=>`linha ${a}–${ln.n}`); ultimoIdx=idx; return;
    }
    if(vals.length && !dataAtual) ignoradas.push({ref, texto:tx});
  });
  return {lancamentos:lanc, ignoradas, ano};
}
let pdfjsPromessa=null;
function carregarScript(src){ return new Promise((ok,err)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>err(new Error("falha ao carregar")); document.head.appendChild(s); }); }
async function obterPdfjs(){
  if(window.pdfjsLib) return window.pdfjsLib;
  const base="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  if(!pdfjsPromessa) pdfjsPromessa=(async()=>{ await carregarScript(base+"pdf.worker.min.js"); await carregarScript(base+"pdf.min.js"); window.pdfjsLib.GlobalWorkerOptions.workerSrc=base+"pdf.worker.min.js"; return window.pdfjsLib; })();
  try{ return await pdfjsPromessa; }
  catch(e){ pdfjsPromessa=null; throw erroExt("Não consegui carregar o leitor de PDF. Ele precisa de internet na primeira leitura de PDF (o extrato continua sem sair do navegador). Sem internet, use CSV ou OFX."); }
}
async function lerPDF(buf){
  const pdfjs=await obterPdfjs();
  let doc;
  try{ doc=await pdfjs.getDocument({data:new Uint8Array(buf), isEvalSupported:false}).promise; }
  catch(e){ if(e && e.name==="PasswordException") throw erroExt("Este PDF tem senha. Abra-o no leitor de PDF, salve uma cópia sem senha ou peça o extrato em CSV ou OFX."); throw erroExt("Não consegui abrir este PDF. Ele pode estar corrompido."); }
  const linhas=[]; let total=0;
  for(let p=1;p<=doc.numPages;p++){
    const pg=await doc.getPage(p); const tc=await pg.getTextContent();
    const itens=tc.items.filter(it=>it.str && it.str.trim()).map(it=>({x:it.transform[4], y:it.transform[5], s:it.str, w:it.width||0}));
    total+=itens.reduce((a,it)=>a+it.s.trim().length,0);
    itens.sort((a,b)=> (b.y-a.y) || (a.x-b.x));
    const grupos=[]; for(const it of itens){ const g=grupos.find(g=>Math.abs(g.y-it.y)<=2.5); if(g) g.itens.push(it); else grupos.push({y:it.y, itens:[it]}); }
    grupos.sort((a,b)=>b.y-a.y);
    grupos.forEach((g,i)=>{ g.itens.sort((a,b)=>a.x-b.x); let txt="", fim=null; g.itens.forEach(it=>{ if(fim!=null && it.x-fim>1.5) txt+=" "; else if(fim!=null && txt && !/\s$/.test(txt)) txt+= (it.x-fim>0.3?" ":""); txt+=it.s; fim=it.x+it.w; }); linhas.push({pag:p, n:i+1, texto:txt.replace(/\s+/g," ").trim()}); });
  }
  if(total < 40*doc.numPages) throw erroExt("Este PDF parece ser uma imagem escaneada: não há texto para ler, e o app não faz reconhecimento de imagem. Peça ao banco o extrato em CSV ou OFX, ou um PDF gerado pelo internet banking.", {escaneado:true});
  const textoTodo=linhas.map(l=>l.texto).join("\n");
  const r=lerLinhasTexto(linhas, textoTodo);
  if(!r.lancamentos.length) throw erroExt("O PDF tem texto, mas não reconheci lançamentos com data e valor. O layout deste banco pode não ser compatível; tente CSV ou OFX.");
  const avisos=["Em PDF, a leitura depende do layout do banco. Confira cada achado com a linha original."];
  if(r.lancamentos.some(l=>l.anoInferido)) avisos.push(`Algumas datas não tinham ano; usei ${r.ano}, o ano que mais aparece no arquivo.`);
  if(r.lancamentos.some(l=>l.sinalIncerto)) avisos.push("Em alguns lançamentos não deu para saber se o valor entrou ou saiu; eles aparecem como \"sentido não identificado\" e ficam fora dos totais.");
  return {formato:"PDF", paginas:doc.numPages, lancamentos:r.lancamentos, ignoradas:r.ignoradas, avisos};
}
async function lerTextoArquivo(f){
  const buf=await f.arrayBuffer();
  try{ return new TextDecoder("utf-8",{fatal:true}).decode(buf); }catch(e){ return new TextDecoder("windows-1252").decode(buf); }
}

let EXT = null;
async function lerArquivoExtrato(f){
  const nome=f.name||"extrato"; const ext=(nome.split(".").pop()||"").toLowerCase();
  if(f.size>25*1024*1024){ EXT={erro:"Arquivo grande demais (limite de 25 MB).", arquivo:nome}; render(); return; }
  if(rotaAtual()==="rapido") casoRapido();
  EXT={carregando:true, arquivo:nome}; render();
  try{
    let r;
    if(ext==="pdf" || f.type==="application/pdf") r=await lerPDF(await f.arrayBuffer());
    else {
      const txt=await lerTextoArquivo(f);
      if(/^%PDF/.test(txt)) r=await lerPDF(await f.arrayBuffer());
      else if(ext==="ofx" || /<OFX>|OFXHEADER/i.test(txt)) r=lerOFX(txt);
      else if(ext==="csv" || ext==="txt" || ext==="tsv") r=lerCSV(txt);
      else throw erroExt("Formato não reconhecido. Use CSV, OFX ou PDF com texto.");
    }
    EXT=Object.assign({arquivo:nome, lidoEm:agoraISO()}, r); RAP.passo=2;
  }catch(e){ EXT={erro:e.message, escaneado:!!e.escaneado, arquivo:nome}; }
  render();
}

function graficoEnvios(A,c){
  if(!A.env.length) return "";
  const lanc=EXT.lancamentos.map(l=>l.data).sort();
  const ym = iso => +iso.slice(0,4)*12 + (+iso.slice(5,7)-1);
  const m0=ym(lanc[0]), m1=ym(lanc[lanc.length-1]); const n=m1-m0+1;
  const meses=Array.from({length:n},()=>({norm:0, inv:0}));
  A.env.forEach(a=>{ const k=ym(a.data)-m0; if(a.faixa==="janela"||a.faixa==="apos") meses[k].inv+=Math.abs(a.valor); else meses[k].norm+=Math.abs(a.valor); });
  const max=Math.max(...meses.map(m=>m.norm+m.inv),1);
  const W=760, H=200, L=56, R=12, T=14, B=26; const bw=(W-L-R)/n; const y=v=>T+(H-T-B)*(1-v/max);
  const passo = max>50000? 20000 : max>20000? 10000 : max>8000? 5000 : max>3000? 2000 : 1000;
  let ticks=""; for(let v=0; v<=max; v+=passo) ticks+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="g-grid"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end" class="g-ax">${v>=1000?(v/1000).toLocaleString("pt-BR")+" mil":v}</text>`;
  const bars=meses.map((m,i)=>{ const x=L+i*bw+bw*0.15, w=Math.max(1.5,bw*0.7); let s=""; if(m.norm) s+=`<rect x="${x}" y="${y(m.norm)}" width="${w}" height="${y(0)-y(m.norm)}" rx="1.5" class="g-bar"/>`; if(m.inv) s+=`<rect x="${x}" y="${y(m.norm+m.inv)}" width="${w}" height="${y(m.norm)-y(m.norm+m.inv)}" rx="1.5" class="g-inv"/>`; return s; }).join("");
  let anos=""; for(let i=0;i<n;i++){ const mm=(m0+i)%12; if(mm===0||i===0) anos+=`<text x="${L+i*bw+2}" y="${H-8}" class="g-ax">${Math.floor((m0+i)/12)}</text>`; }
  const j=janelaCaso(c); let sepL="";
  if(j){ const sd=c.inicial.dataSeparacao; const k=ym(sd)-m0 + (+sd.slice(8,10)-1)/30; if(k>=0 && k<=n){ const x=L+k*bw; sepL=`<line x1="${x}" x2="${x}" y1="${T-6}" y2="${y(0)}" class="g-sep"/><text x="${x-4}" y="${T}" text-anchor="end" class="g-lab">Separação · ${fmtData(sd)}</text>`; } }
  return `<figure class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Valores enviados a corretoras por mês">${ticks}${bars}${sepL}${anos}</svg>
    <figcaption><span class="lg-row"><span><i class="sw" style="background:var(--accent)"></i>Enviado a corretoras, por mês (R$)</span><span><i class="sw" style="background:var(--alert)"></i>Movimentação a investigar</span></span></figcaption></figure>`;
}

let BC = { carregando:false, erro:null, res:null, importando:false, colagens:[] };

const DIA=864e5;
const tsData = iso => Date.parse(iso+"T23:59:59Z")/1000;
function janelaCaso(c){ if(!c||!c.inicial.dataSeparacao) return null; const sep=tsData(c.inicial.dataSeparacao); const dias=Number(c.inicial.janelaDias??90); return {sep, ini: sep - dias*86400, dias}; }
function movimentosInvestigar(txs, c){
  const j=janelaCaso(c); if(!j) return {janela:0, apos:0, lista:new Set()};
  let jan=0, apos=0; const lista=new Set();
  txs.forEach(t=>{ if(!t.confirmada||!t.tempo||t.liquido>=0) return; if(t.tempo>j.ini && t.tempo<=j.sep){ jan+=-t.liquido; lista.add(t.txid); } else if(t.tempo>j.sep){ apos+=-t.liquido; lista.add(t.txid); } });
  return {janela:jan, apos, lista};
}
const fmtBTCcurto = s => (s/1e8).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:s<1e6?8:4});
function graficoSaldo(txs, c, rotuloFonte){
  const conf=txs.filter(t=>t.confirmada&&t.tempo).sort((a,b)=>a.tempo-b.tempo); if(!conf.length) return "";
  const j=janelaCaso(c);
  let bal=0; const pts=conf.map(t=>{ bal+=t.liquido; return [t.tempo, bal, t]; });
  const maxB=Math.max(...pts.map(p=>p[1]),1);
  const t0=conf[0].tempo - 20*86400; let t1=Math.max(conf[conf.length-1].tempo, j? j.sep+60*86400 : 0) + 20*86400;
  const W=760,H=250,X0=56,X1=736,Y0=212,Y1=24;
  const X=t=> X0+(t-t0)/(t1-t0)*(X1-X0), Y=b=> Y0-(b/(maxB*1.12))*(Y0-Y1);
  let d=`M${X(t0).toFixed(1)} ${Y(0).toFixed(1)}`; pts.forEach(([t,b])=>{ d+=` H${X(t).toFixed(1)} V${Y(b).toFixed(1)}`; }); d+=` H${X(t1).toFixed(1)}`;
  const area=d+` V${Y0} H${X0} Z`;
  const mv=movimentosInvestigar(conf,c);
  const anos=[]; for(let y=new Date(t0*1000).getUTCFullYear()+1; y<=new Date(t1*1000).getUTCFullYear(); y++){ const ts=Date.UTC(y,0,1)/1000; if(ts>t0&&ts<t1) anos.push([y,ts]); }
  const yt=[0,maxB/2,maxB];
  const marcas=pts.filter(p=>mv.lista.has(p[2].txid));
  return `<figure class="chart">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Saldo do endereço ao longo do tempo${j?", com a janela antes da separação de fato e as saídas a investigar":""}">
      ${j?`<rect x="${X(Math.max(j.ini,t0)).toFixed(1)}" y="${Y1}" width="${Math.max(0,X(j.sep)-X(Math.max(j.ini,t0))).toFixed(1)}" height="${Y0-Y1}" fill="var(--alert-bg)"></rect>`:""}
      ${yt.slice(1).map(v=>`<line x1="${X0}" x2="${X1}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)"></line>`).join("")}
      <line x1="${X0}" x2="${X1}" y1="${Y0}" y2="${Y0}" stroke="var(--line-strong)"></line>
      <path d="${area}" fill="var(--accent-50)"></path>
      <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2"></path>
      ${j?`<line x1="${X(j.sep).toFixed(1)}" x2="${X(j.sep).toFixed(1)}" y1="${Y1-6}" y2="${Y0}" stroke="var(--ink)" stroke-dasharray="3 3"></line>
        <text x="${(X(j.sep)-4).toFixed(1)}" y="${Y1-10}" text-anchor="end" font-size="10" fill="var(--ink)" font-family="Hanken Grotesk, sans-serif">Separação de fato · ${fmtData(c.inicial.dataSeparacao)}</text>`:""}
      ${marcas.map(([t,b,tx])=>`<circle cx="${X(t).toFixed(1)}" cy="${Y(b).toFixed(1)}" r="4.5" fill="var(--surface)" stroke="var(--alert)" stroke-width="2"><title>${fmtUnix(t)}: ${btcS(tx.liquido)} BTC</title></circle>
        <text x="${(X(t)+8).toFixed(1)}" y="${(Y(b)-8).toFixed(1)}" font-size="9.5" fill="var(--alert)" font-family="Hanken Grotesk, sans-serif">−${fmtBTCcurto(-tx.liquido)}</text>`).join("")}
      ${yt.map(v=>`<text x="${X0-8}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--faint)" font-family="IBM Plex Mono, monospace">${v?fmtBTCcurto(v):"0"}</text>`).join("")}
      ${anos.map(([y,ts])=>`<text x="${X(ts).toFixed(1)}" y="${Y0+16}" font-size="9" fill="var(--faint)" font-family="IBM Plex Mono, monospace">${y}</text>`).join("")}
    </svg>
    <div class="lg-row"><span><span class="sw" style="background:var(--accent)"></span>Saldo do endereço (BTC)</span>${j?`<span><span class="sw" style="background:var(--alert-bg);box-shadow:inset 0 0 0 1px var(--alert-line)"></span>${j.dias} dias antes da separação · parâmetro sugerido pelo app, sem previsão legal</span><span><span class="sw" style="background:var(--alert)"></span>Movimentação a investigar</span>`:""}</div>
    <figcaption><span>A blockchain mostra as movimentações do endereço, não quem o controla.</span><span>${esc(rotuloFonte)}</span></figcaption>
  </figure>`;
}
