/* =========================================================
   4. Cálculo da meação
   Regras fixas, conforme o TCC (tópicos 2.4, 4.2 e 5.1). Quantidades em
   unidades inteiras de 10^-8 (satoshis, no caso do BTC), para não haver
   erro de arredondamento. A meação é calculada primeiro em quantidade e
   só depois avaliada pela cotação da data de referência (data da partilha).
   ========================================================= */
const ATIVOS_CALC = { BTC:"Bitcoin (BTC)", ETH:"Ether (ETH)", USDT:"Tether (USDT)" };
const FORMAS = {
  compra:"Compra com pagamento em dinheiro",
  doacao:"Doação ou herança só para um cônjuge",
  prevenda:"Pré-venda paga antes da união e recebida depois",
  rend_sep:"Rendimento (staking, empréstimo) guardado em lote separado",
  rend_mist:"Rendimento reinvestido e misturado ao saldo",
  airdrop_sorteio:"Airdrop por sorteio",
  airdrop_prop:"Airdrop proporcional ao saldo",
  airdrop_lib:"Airdrop como liberalidade a um só cônjuge",
  conv_comum:"Troca de ativo comum por outro ativo",
  conv_part:"Troca de ativo particular por outro ativo"
};
const ORIGENS_REC = {
  comuns:"Recursos comuns (salário, conta do casal, rendimentos do trabalho)",
  part_total:"Somente recursos particulares",
  part_parcial:"Parte com recursos particulares",
  nao_informada:"Origem não informada"
};
const ST_CALC = {
  comunicavel:{t:"Comunicável", k:"ok"}, particular:{t:"Particular", k:"nv"}, parcial:{t:"Parcialmente comunicável", k:"warn"},
  indeterminavel:{t:"Não determinável sem perícia", k:"bad"}, nao_comunica:{t:"Não se comunica", k:"nv"}, sem_datas:{t:"Faltam datas do caso", k:"warn"}
};
const SAT = 1e8;
const paraUnid = v => { if(v==null||v==="") return null; let s=String(v).trim().replace(/\s/g,""); if(s.includes(",")) s=s.replace(/\./g,"").replace(",","."); const n=Number(s); return isFinite(n)&&n>0? Math.round(n*SAT) : null; };
const fmtQ = (u, ativo) => (u/SAT).toLocaleString("pt-BR",{minimumFractionDigits:8,maximumFractionDigits:8}) + (ativo? " "+ativo : "");
const fmtQcurto = (u, ativo) => (u/SAT).toLocaleString("pt-BR",{maximumFractionDigits:8}) + (ativo? " "+ativo : "");

/* Classifica um lote num cenário. dIni = início da união; dSep = separação de fato (ISO). */
function classificarLote(L, dIni, dSep){
  const q=L.quantidade; const r = (status, extra={}) => Object.assign({status, qCom:0, qPart:0, qInd:0, qFora:0, avisos:[]}, extra);
  const com = (regra, base, tcc, av=[]) => r("comunicavel",{qCom:q, regra, base, tcc, avisos:av});
  const part = (regra, base, tcc, av=[]) => r("particular",{qPart:q, regra, base, tcc, avisos:av});
  const fora = (regra, base, tcc) => r("nao_comunica",{qFora:q, regra, base, tcc});
  if(L.forma==="rend_mist") return r("indeterminavel",{qInd:q, regra:"Rendimento reinvestido e misturado ao saldo: não há como separar rendimento de capital com os dados disponíveis.", base:"Método do app: rendimentos só são calculados quando registrados como lote separado", tcc:"2.4"});
  if(L.forma==="conv_comum") return com("Ativo que ocupa o lugar de um ativo comum continua comum, mesmo após a separação de fato.", "Lógica da sub-rogação (CC, art. 1.659, I e II) aplicada aos bens comuns", "5.1");
  if(!dIni || !dSep) return r("sem_datas",{regra:"Informe o início da união e a separação de fato no passo 1.", base:"", tcc:""});
  const d=L.data||"";
  const antes = d && d<dIni, depois = d && d>dSep, durante = d && !antes && !depois;
  const semProvaData = antes && !L.dataProvada;
  const presuncao = ["A data de aquisição não foi provada: o bem móvel presume-se adquirido na constância (CC, art. 1.662).","CC, art. 1.662 (criptoativo como bem móvel)","2.4 e 3.2"];
  if(L.forma==="conv_part"){
    if(L.nexo) return part("Ativo que substitui um ativo particular, com o nexo documentado, continua particular (sub-rogação).", "CC, art. 1.659, I e II", "2.4");
    if(!d) return com(...presuncao, ["Troca de ativo particular alegada sem nexo documentado."]);
  }
  if(L.forma==="doacao" || L.forma==="airdrop_lib"){
    if(L.dataProvada || L.nexo) return part(L.forma==="doacao"? "Doação ou herança só para um cônjuge é particular." : "Recebimento por liberalidade a um só cônjuge é particular, desde que provado o caráter de liberalidade.", "CC, art. 1.659, I", "2.4");
    return com("Exceção à comunicabilidade não provada: a regra é a comunicação, e quem alega a exceção deve prová-la.", "CC, arts. 1.658 e 1.659, I (interpretação restritiva)", "2.4", ["Registre o documento da doação ou da liberalidade para que o lote seja tratado como particular."]);
  }
  if(L.forma==="prevenda"){
    if(L.dataPagamento && L.dataPagamento<dIni && L.dataProvada) return part("Pago antes da união e recebido depois: título anterior ao casamento.", "CC, art. 1.661", "2.4");
    if(L.dataPagamento && L.dataPagamento<dIni) return com(...presuncao, ["Pagamento anterior à união alegado sem prova."]);
  }
  if(!d) return com(...presuncao);
  const fruto = L.forma==="rend_sep" || L.forma==="airdrop_prop";
  if(antes){
    if(semProvaData) return com(...presuncao, ["Data anterior à união alegada sem prova."]);
    return part(fruto? "Rendimento recebido antes da união segue o bem de origem e não entra na comunhão." : "Adquirido antes da união, com prova da data.", "CC, art. 1.659, I", "2.4");
  }
  if(depois){
    if(fruto && L.origemBem==="comum") return com("Fruto de bem comum percebido após a separação de fato continua comum.", JULGADOS.resp2223719.cit, "2.3");
    if(L.forma==="compra" && L.origem==="comuns") return com("Comprado após a separação com recursos comuns: o ativo ocupa o lugar do dinheiro comum e continua comum.", "Lógica da sub-rogação aplicada aos bens comuns (CC, art. 1.659, I e II)", "5.1");
    return fora("Adquirido após a separação de fato: já não entra na comunhão.", "Fim da comunhão com a separação de fato (Calmon; Dias; "+JULGADOS.resp2223719.cit+")", "2.4 e 2.5");
  }
  // durante a união
  if(fruto) return com("Fruto percebido durante a união se comunica, ainda que o bem de origem seja particular.", "CC, art. 1.660, V", "2.4");
  if(L.forma==="airdrop_sorteio") return com("Recebimento por fator aleatório: fato eventual.", "CC, art. 1.660, II", "2.4");
  if(L.forma==="compra" && (L.origem==="part_total"||L.origem==="part_parcial")){
    if(!L.nexo) return com("Compra onerosa durante a união: comunicável. A alegação de recursos particulares não veio acompanhada de prova da venda do bem particular e do nexo com esta compra.", "CC, arts. 1.658 e 1.660, I; declaração não basta (Madaleno; Dias)", "2.4", ["Para afastar a comunicação, registre o documento que liga a venda do bem particular a esta compra."]);
    const total=+L.valorPago||0; const pv = L.origem==="part_total"? total : Math.min(+L.valorParticular||0, total);
    if(L.origem==="part_total" || (total>0 && pv>=total)) return part("Comprado só com recursos particulares, com o nexo documentado (sub-rogação).", "CC, art. 1.659, II", "2.4");
    if(!(total>0) || !(pv>0)) return com("Sub-rogação parcial sem os valores necessários: informe o valor total pago e a parte paga com recursos particulares.", "CC, art. 1.659, II", "2.4", ["Faltam valores para a conta da sub-rogação."]);
    const qPart=Math.round(pv/total*q); const qCom=q-qPart;
    return r("parcial",{qPart, qCom, regra:"Sub-rogação parcial: só a parcela paga com recursos particulares fica fora da partilha; o restante se comunica.", base:"CC, art. 1.659, II (Lôbo; Calmon; Gonçalves)", tcc:"2.4",
      conta:{pv, total, q, qPart, qCom, texto:`(${brl(pv)} ÷ ${brl(total)}) × ${fmtQ(q,L.ativo)} = ${fmtQ(qPart,L.ativo)} particular; ${fmtQ(q,L.ativo)} − ${fmtQ(qPart,L.ativo)} = ${fmtQ(qCom,L.ativo)} comunicável`}});
  }
  return com("Compra onerosa durante a união: comunicável, sem discussão sobre quem contribuiu (presunção absoluta de esforço comum).", "CC, arts. 1.658 e 1.660, I; "+JULGADOS.agrg1475560.cit, "2.4 e 2.5",
    L.origem==="comuns"? [] : L.origem==="nao_informada"? [] : []);

function calcularMeacao(c){
  const cen=cenariosInicio(c); const dSep=c.inicial.dataSeparacao;
  const lotes=c.lotes||[];
  const cenarios=(cen.length?cen:[{rotulo:"Início da união", data:""}]).map(s=>{
    const res=lotes.map(L=>({L, k:classificarLote(L, s.data, dSep)}));
    const porAtivo={};
    res.forEach(({L,k})=>{ const a=porAtivo[L.ativo]||(porAtivo[L.ativo]={ativo:L.ativo, com:0, part:0, ind:0, fora:0, n:0}); a.com+=k.qCom; a.part+=k.qPart; a.ind+=k.qInd; a.fora+=k.qFora; a.n++; });
    Object.values(porAtivo).forEach(a=>{ a.meacao=Math.floor(a.com/2); a.resto=a.com-2*a.meacao; });
    return {rotulo:s.rotulo, data:s.data, res, porAtivo};
  });
  return {cenarios, dSep, completo: cen.length && dSep};
}

const PROV_COT = {

const COINGECKO_ID = { BTC:"bitcoin", ETH:"ethereum", USDT:"tether" };
/* Preço no momento da consulta: Binance (par em reais) e, se falhar, CoinGecko. */
async function buscarCotacaoAgora(ativo){
  const tenta = async (url, ler) => { const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),10000);
    try{ const r=await fetch(url,{signal:ctl.signal}); if(!r.ok) throw new Error("HTTP "+r.status); const v=ler(await r.json()); if(!(v>0)) throw new Error("sem preço"); return v; } finally{ clearTimeout(t); } };
  try{ const url=`https://api.binance.com/api/v3/ticker/price?symbol=${ativo}BRL`; const v=await tenta(url, j=>+j.price);
    return {valor:v, url, fonte:`Binance, API pública (par ${ativo}/BRL)`, metodo:"Último preço negociado no momento da consulta"}; }
  catch(e){ const id=COINGECKO_ID[ativo]; if(!id) throw e;
    const url=`https://api.coingecko.com/api/v3/simple/price?ids=${id}&vs_currencies=brl`; const v=await tenta(url, j=>+(j[id]||{}).brl);
    return {valor:v, url, fonte:"CoinGecko, API pública (preço agregado em reais)", metodo:"Preço agregado no momento da consulta"}; }
}
async function buscarCotacao(ativo, dataISO, prov){
  const [y,m,d]=dataISO.split("-").map(Number);
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),12000);
  try{
    if(prov==="mb"){
      const url=`https://www.mercadobitcoin.net/api/${ativo}/day-summary/${y}/${m}/${d}/`;
      const r=await fetch(url,{signal:ctl.signal}); if(!r.ok) throw new Error("HTTP "+r.status);
      const j=await r.json(); const v=+j.closing; if(!(v>0)) throw new Error("resposta sem preço de fechamento");
      return {valor:v, url, metodo:PROV_COT.mb.metodo, fonte:"Mercado Bitcoin, API pública (day-summary)"};
    }
    const start=Date.UTC(y,m-1,d);
    const url=`https://api.binance.com/api/v3/klines?symbol=${ativo}BRL&interval=1d&startTime=${start}&limit=1`;
    const r=await fetch(url,{signal:ctl.signal}); if(!r.ok) throw new Error("HTTP "+r.status);
    const j=await r.json(); if(!Array.isArray(j)||!j.length||j[0][0]!==start) throw new Error("sem candle para esta data");
    const emAndamento = j[0][6] > Date.now();
    return {valor:+j[0][4], url, metodo:PROV_COT.binance.metodo+(emAndamento?"; dia ainda em andamento, preço parcial":""), fonte:`Binance, API pública (par ${ativo}/BRL)`};
  } finally { clearTimeout(t); }
}

/* ----- Cálculo a partir do extrato -----
   O extrato mostra reais enviados às corretoras, não a quantidade de criptoativos.
   Aqui o app: (1) soma os envios e recebimentos por período (antes da união, durante, após a separação);
   (2) estima a quantidade de cada envio dividindo o valor pela cotação do dia (método adotado pelo app,
   sempre rotulado como estimativa); (3) transforma as estimativas em lotes, que seguem as regras do cálculo. */
function transfExtrato(c){
  return (c.evidencias||[]).filter(e=>e.tipo==="extrato_bancario" && e.achado && e.achado.categoria==="corretora" && (e.achado.sentido==="enviado"||e.achado.sentido==="recebido"))
    .map(e=>({id:e.id, ficticio:!!e.ficticio, data:e.achado.data, valor:Math.abs(e.achado.valor), sentido:e.achado.sentido, corretora:e.achado.corretora, cnpj:e.achado.cnpj||"", linha:(e.leitura||{}).linha||"", arquivo:(e.leitura||{}).arquivo||""}))
    .sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:0);
}
function periodoDe(d, dIni, dSep){ if(!d||!dIni||!dSep) return "sem"; return d<dIni? "antes" : d>dSep? "apos" : "durante"; }
const PERIODOS_EXT = { antes:"Antes da união", durante:"Durante a união", apos:"Após a separação", sem:"Sem datas do caso" };
function aportesExtrato(c){
  const T=transfExtrato(c); const cen=cenariosInicio(c); const dSep=c.inicial.dataSeparacao;
  const cenarios=(cen.length?cen:[{rotulo:"Início da união", data:""}]).map(s=>{
    const per={antes:{env:0,rec:0,n:0}, durante:{env:0,rec:0,n:0}, apos:{env:0,rec:0,n:0}, sem:{env:0,rec:0,n:0}};
    T.forEach(t=>{ const p=per[periodoDe(t.data,s.data,dSep)]; p.n++; if(t.sentido==="enviado") p.env+=t.valor; else p.rec+=t.valor; });
    return {rotulo:s.rotulo, data:s.data, per};
  });
  return {T, cenarios, completo: cen.length && dSep};
}
function extEstim(c){ if(!c.extEstim) c.extEstim={ativo:"BTC", cot:{}}; return c.extEstim; }
function cotDoDia(c, data){ return ((c.extEstim||{}).cot||{})[data] || null; }
function qtdEstimada(c, t){ const k=cotDoDia(c,t.data); return (k && t.sentido==="enviado" && k.valor>0)? Math.round(t.valor/k.valor*SAT) : 0; }
function loteDoEnvio(c, t){ return (c.lotes||[]).find(L=>L.extId===t.id || (L.data===t.data && Math.abs((+L.valorPago||0)-t.valor)<0.005 && L.forma==="compra")); }

      <div class="row"><a class="btn ghost" href="#rapido">Carregar um extrato</a></div>`}
  </section>`;

  const semCot=envs.filter(t=>!cotDoDia(c,t.data)); const comEst=envs.filter(t=>qtdEstimada(c,t)>0);
  const novos=comEst.filter(t=>!loteDoEnvio(c,t));

      <div class="fig acc"><span class="l">Enviado durante a união</span><span class="v">${brl(s.per.durante.env)}</span><span class="s">${s.per.durante.rec?`recebido de volta: ${brl(s.per.durante.rec)}`:"nada recebido de volta"}</span></div>
      <div class="fig"><span class="l">Antes da união</span><span class="v">${brl(s.per.antes.env)}</span><span class="s">${s.per.antes.rec?`recebido: ${brl(s.per.antes.rec)}`:"enviado"}</span></div>
      <div class="fig ${s.per.apos.env?"alert":""}"><span class="l">Após a separação</span><span class="v">${brl(s.per.apos.env)}</span><span class="s">${s.per.apos.env?"movimentação a investigar":"nada enviado"}</span></div>
    </div>`;
  const linha=t=>{ const k=cotDoDia(c,t.data); const q=qtdEstimada(c,t); const L=t.sentido==="enviado"? loteDoEnvio(c,t) : null;
    const pers=R.cenarios.map(s=>periodoDe(t.data,s.data,dSep));
    return `<tr><td class="num">${fmtData(t.data)}</td><td>${esc(t.corretora)}</td><td>${t.sentido==="enviado"?"Enviado":"Recebido"}</td><td class="num">${brl(t.valor)}</td>
      <td>${[...new Set(pers)].map(p=>`<span class="pill ${p==="durante"?"ok":p==="apos"?"alert":""}">${esc(PERIODOS_EXT[p])}</span>`).join(" ")}${multi&&new Set(pers).size>1?' <span class="tiny muted">conforme o cenário</span>':""}</td>
      <td class="num">${t.sentido!=="enviado"? '<span class="tiny muted">—</span>' : k? `${brl(k.valor)}${k.origem==="demo"?' <span class="pill fict">Ilustrativa</span>':k.origem==="manual"?' <span class="pill nv">Manual</span>':""}` : `<details class="inline-cot"><summary class="link">informar</summary>
          <form data-form="extCot" data-d="${esc(t.data)}" class="grid2" style="margin-top:8px;min-width:240px"><label class="field"><span>Preço de 1 ${esc(a)} (R$)</span><input name="valor" inputmode="decimal" required></label><label class="field"><span>Fonte</span><input name="fonte" required placeholder="Ex.: CoinMarketCap, fechamento"></label><div class="row"><button class="sm" type="submit">Usar</button></div></form></details>`}</td>
      <td class="num">${q? `≈ ${fmtQ(q,a)}` : t.sentido==="enviado"? '<span class="tiny muted">sem cotação</span>' : '<span class="tiny muted">o extrato não diz o que foi vendido</span>'}</td>

    ${R.T.some(t=>t.sentido==="recebido")? `<p class="tiny muted">Valores recebidos das corretoras podem indicar venda ou saque de criptoativos. O app não os desconta da quantidade, porque o extrato não diz o que foi vendido; o extrato da corretora esclarece.</p>`:""}
    <p class="tiny muted">Ao buscar preços, o navegador envia à Binance só o ativo e cada data, além do seu endereço de internet; nenhum dado do caso.</p>
  </section>`;
}
function lotesDoExtrato(c){
  const E=extEstim(c); const a=E.ativo||"BTC"; if(!Array.isArray(c.lotes)) c.lotes=[];
  let n=0;
  transfExtrato(c).filter(t=>t.sentido==="enviado").forEach(t=>{ const q=qtdEstimada(c,t); if(!q || loteDoEnvio(c,t)) return; const k=cotDoDia(c,t.data);
    c.lotes.push({id:uid(), ficticio:t.ficticio || k.origem==="demo", extId:t.id, estimado:true, ativo:a, data:t.data, quantidade:q, valorPago:t.valor, forma:"compra", origem:"nao_informada", valorParticular:"",
      nexo:false, nexoRef:"", dataProvada:false, provaRef:"", dataPagamento:"", origemBem:"particular",
      custodia:t.corretora+(t.cnpj?" (CNPJ "+fmtCNPJ(t.cnpj)+")":""),
      cotEstim:{valor:k.valor, fonte:k.fonte, origem:k.origem, url:k.url||""},
      obs:`Quantidade estimada pelo app: ${brl(t.valor)} ÷ ${brl(k.valor)} (preço de 1 ${a} em ${fmtData(t.data)}; ${k.fonte}). Envio do extrato bancário${t.arquivo?" "+t.arquivo:""}${t.linha?", "+t.linha:""}. A quantidade e a data da compra devem ser confirmadas no extrato da corretora.`});
    n++; });
  return n;
}

function atualizarFormLote(){
  const f=document.querySelector('form[data-form=lote]'); if(!f) return;
  const forma=f.forma.value, origem=f.origem.value;
  const ver={ compra: forma==="compra", parcial: forma==="compra"&&origem==="part_parcial", nexo:(forma==="compra"&&(origem==="part_total"||origem==="part_parcial"))||forma==="conv_part", prevenda: forma==="prevenda", fruto: forma==="rend_sep"||forma==="airdrop_prop" };
  f.querySelectorAll("[data-se]").forEach(el=>{ el.hidden=!ver[el.dataset.se]; });
}
V.calculo = c => {
  const i=c.inicial; const cen=cenariosInicio(c);
  const topo = cabecalho("Passo 4 de 6 · Cálculo","Quanto é de cada um?");
  if(i.regime==="nao_informado") return `${topo}${vazio("calc","Informe o regime de bens","O cálculo depende do regime.",`<a class="btn pri" href="#caso">Ir para Caso</a>`)}${navegacaoPassos(c)}`;
  if(!noEscopo(c)) return `${topo}
    <div class="lockbox">${icon("cadeado")}<div><h2>Fora do escopo</h2>
      <p>O cálculo aplica as regras da comunhão parcial (CC, arts. 1.658 a 1.666), inclusive à união estável sem contrato escrito (art. 1.725). Este caso está em <b>${esc(REGIMES[i.regime])}</b>, regime que o TCC não examina.</p>
      <p class="muted">Indícios, Blockchain e Pedidos continuam funcionando, porque a investigação serve a qualquer regime.</p></div></div>${navegacaoPassos(c)}`;
  const M=calcularMeacao(c);
  const marco=(rot,d)=>`<div class="fig"><span class="l">${esc(rot)}</span><span class="v" style="font-size:1.6rem">${d?fmtData(d):"—"}</span></div>`;
  return `${topo}
  <section class="panel">
    ${cen.length>1? `<div class="scenarios">${cen.map((s,k)=>`<div class="scenario"><span class="eyebrow">Cenário ${k+1}</span><div class="grid2">${marco(s.rotulo,s.data)}${marco("Separação de fato",i.dataSeparacao)}</div></div>`).join("")}</div><p class="small muted">Início da união controvertido: os dois cenários aparecem lado a lado, sem escolha entre eles.</p>`
      : `<div class="figs">${marco(cen[0]?.rotulo||"Início da união",cen[0]?.data)}${marco("Separação de fato",i.dataSeparacao)}${marco("Avaliação (data da partilha)",(c.avaliacao||{}).data)}</div>`}
    ${!cen.length||!i.dataSeparacao?`<div class="note warn">Informe ${!cen.length?"o início da união":""}${!cen.length&&!i.dataSeparacao?" e ":""}${!i.dataSeparacao?"a separação de fato":""} em <a href="#caso">Caso</a>.</div>`:""}
  </section>
  ${painelExtratoCalc(c)}
  ${painelResultado(c,M)}
  ${formLote(c)}
  ${painelLotes(c,M)}
  ${painelCotacao(c)}
  <details class="more"><summary>Regras aplicadas (${REGRAS_CALC.length})</summary>
    <div class="tablewrap"><table><thead><tr><th>Situação</th><th>Resultado</th><th>Base</th><th>TCC</th></tr></thead><tbody>
      ${REGRAS_CALC.map(r=>`<tr><td>${esc(r.sit)}</td><td><span class="pill ${r.k}">${esc(r.res)}</span></td><td class="small">${esc(r.base)}</td><td class="small num">${esc(r.tcc)}</td></tr>`).join("")}
    </tbody></table></div>
    <p class="small muted" style="margin-top:12px">Métodos adotados pelo app: sub-rogação parcial = (valor pago com recursos particulares ÷ valor total pago) × quantidade adquirida; rendimentos só são calculados quando registrados como lote separado; a meação é metade da quantidade comunicável, avaliada pela cotação da data de referência.</p></details>
  <p class="tiny muted">O cálculo é apoio ao advogado e não substitui perícia. A valorização de ativo particular não é tratada como comunicável (conclusão por analogia, ainda não enfrentada pelos tribunais; TCC, 2.4).</p>
  ${navegacaoPassos(c)}`;
};

  declaracao:{t:"Da declaração patrimonial detalhada", p:["Os deveres de boa-fé e de cooperação (CPC, arts. 5º e 6º) autorizam que se exija da parte requerida declaração patrimonial detalhada, com menção expressa a criptoativos, às plataformas utilizadas e aos endereços de carteira conhecidos, sob compromisso de veracidade. A omissão dolosa pode configurar litigância de má-fé (CPC, art. 80)."], jul:[]},
  exibicao_parte:{t:"Da exibição de documentos pela parte requerida", p:["O juiz pode ordenar à parte a exibição de documento ou coisa que se encontre em seu poder (CPC, art. 396). Tratando-se de criptoativos, isso abrange os extratos das prestadoras, o histórico completo de operações, no formato original gerado pelas plataformas, e a indicação dos endereços das carteiras autocustodiadas.","Se a parte não efetuar a exibição nem fizer declaração no prazo, ou se a recusa for havida por ilegítima, o juiz admitirá como verdadeiros os fatos que se pretendia provar, podendo ainda adotar medidas indutivas, coercitivas, mandamentais ou sub-rogatórias (CPC, art. 400)."], jul:[]},
  depoimento:{t:"Do depoimento pessoal", p:["A parte que, intimada pessoalmente e advertida, não comparecer ou se recusar a depor sujeita-se à pena de confissão (CPC, art. 385, § 1º), e as respostas evasivas serão apreciadas pelo juiz (CPC, art. 386)."], jul:[]},
  extratos:{t:"Dos extratos bancários de todo o período da união", p:["Os extratos bancários são o primeiro elo do percurso do ativo, porque neles aparecem as transferências às prestadoras de serviços de ativos virtuais. Havendo indícios de movimentações em criptoativos durante a união, justifica-se a mitigação proporcional e fundamentada do sigilo bancário para todo o período de convivência, como decidiu o Tribunal de Justiça de Minas Gerais:"], jul:[JM("tjmg5033973")]},
  receita:{t:"Da requisição à Receita Federal", p:["As prestadoras de serviços de ativos virtuais devem informar à Receita Federal as operações de seus usuários e o saldo de cada um em 31 de dezembro (IN RFB nº 2.291/2025, arts. 5º, I, e 7º, II). Esses dados, protegidos pelo sigilo fiscal, podem ser requisitados pela autoridade judiciária no interesse da justiça (CTN, art. 198, § 1º, I) e revelam com quais prestadoras a parte requerida operou."], jul:[]},
  sniper:{t:"Da pesquisa pelos sistemas Sisbajud e Sniper", p:["Os sistemas do Conselho Nacional de Justiça permitem alcançar as contas bancárias de onde partiram as compras (Sisbajud) e revelar vínculos patrimoniais, societários e financeiros entre pessoas físicas e jurídicas (Sniper), cujo módulo de dados sigilosos é acessível após decisão judicial. A pesquisa ajuda a identificar a interposição de pessoas e de sociedades, que muitas vezes acompanha a ocultação de criptoativos."], jul:[]},
  corretoras:{t:"Do ofício às prestadoras de serviços de ativos virtuais", p:["O art. 380 do CPC impõe a quem não é parte o dever de informar ao juiz os fatos e as circunstâncias de que tenha conhecimento e de exibir coisa ou documento que esteja em seu poder. As prestadoras de serviços de ativos virtuais devem identificar seus clientes e manter registro das transações (Lei nº 9.613/1998, art. 10, aplicável a elas por força da Lei nº 14.478/2022), de modo que a ordem dirigida à prestadora indicada pelos indícios é útil e específica.","O Superior Tribunal de Justiça reconheceu ser plenamente possível a expedição de ofício às corretoras:"],
    jul:[JM("resp2127038"),
      JM("tjsp2212988","A pesquisa não é meramente especulativa, e essas informações não são alcançadas pelo Sisbajud, como reconheceu o Tribunal de Justiça de São Paulo:"),
      JM("tjdft0713582","No mesmo sentido, o Tribunal de Justiça do Distrito Federal e dos Territórios:"),
      JM("tjsp2225716","A demora favorece a dissipação dos ativos, razão pela qual o Tribunal de Justiça de São Paulo determinou a reiteração dos ofícios sob multa diária:"),
      JM("tjdft0713204","O pedido não é genérico: aponta os indícios e a prestadora que custodiaria os ativos, elementos cuja falta levou ao indeferimento em outro caso:")]},
  criptojud:{t:"Da pesquisa e do bloqueio pelo CriptoJud", p:["O Conselho Nacional de Justiça lançou, em 5 de agosto de 2025, o CriptoJud, sistema que concentra em um único ambiente eletrônico as ordens judiciais antes enviadas por ofício a cada corretora, com implantação gradual nos tribunais. Embora sua disponibilidade ainda dependa da adequação de cada tribunal, o pedido deve constar desde já, para que a pesquisa e o bloqueio sejam feitos por meio dele assim que disponível neste juízo, sem prejuízo dos ofícios. O Tribunal de Justiça de São Paulo já o admitiu como via de pesquisa:"], jul:[JM("tjsp2343909")]},
  exibicao_incidental:{t:"Da exibição incidental em face da prestadora, em caráter subsidiário", p:["Não cumprida a ordem fundada no art. 380 do CPC, cabe a exibição de documento em poder de terceiro. O terceiro é citado para responder no prazo de 15 dias (CPC, art. 401); se negar a obrigação de exibir ou a posse do documento, o juiz designa audiência especial (art. 402); e, se recusar sem justo motivo, o juiz ordena o depósito do documento e, descumprida a ordem, expede mandado de apreensão, sem prejuízo de multa e de outras medidas (art. 403)."], jul:[]},
  pericia:{t:"Da perícia técnica em blockchain", p:["Os registros das prestadoras mostram apenas o que nelas entrou e o que delas saiu. Seguir os ativos depois da saída exige perícia técnica de análise da blockchain, com objeto restrito aos dados patrimoniais. O quesito central não é apenas quanto vale o ativo, mas a quem pertencem os endereços e para onde foram os valores a partir da separação de fato."], jul:[]},
  onus:{t:"Da distribuição do ônus da prova", p:["Em regra, cabe a quem alega a existência do ativo comum prová-la (CPC, art. 373, I), mas o juiz pode atribuir o ônus de modo diverso diante da excessiva dificuldade de cumprir o encargo ou da maior facilidade de obtenção da prova do fato contrário, por decisão fundamentada (art. 373, § 1º). É a parte requerida quem detém as chaves e os registros das operações, razão pela qual lhe cabe demonstrar o destino dos recursos, com definição, de preferência, na decisão de saneamento (art. 357, III). Se alegar a perda dos ativos, a perda é fato que lhe cabe provar."], jul:[]},
  cautelar:{t:"Da tutela cautelar de arrolamento e indisponibilidade", p:["A tutela de urgência será concedida quando houver elementos que evidenciem a probabilidade do direito e o perigo de dano ou o risco ao resultado útil do processo (CPC, art. 300), e a de natureza cautelar pode ser efetivada mediante arrolamento de bens e qualquer outra medida idônea para asseguração do direito (CPC, art. 301). Criptoativos podem ser transferidos em minutos, e quem detém sozinho a posse dos ativos comuns pode dissipá-los antes da partilha."],
    jul:[JM("tjsp2225716","O risco de dissipação desses bens foi reconhecido pelo Tribunal de Justiça de São Paulo:")]},
  custodia:{t:"Da transferência para prestadora autorizada ou da prova de controle", p:["O juiz pode determinar todas as medidas indutivas, coercitivas, mandamentais ou sub-rogatórias necessárias para assegurar o cumprimento de ordem judicial (CPC, art. 139, IV). Sem exigir a entrega de chaves privadas, é possível ordenar à parte que transfira os criptoativos mantidos em carteira autocustodiada para conta em prestadora autorizada, com bloqueio de movimentação até a partilha, ou que demonstre o controle dos endereços indicados por assinatura digital, sob pena de multa (CPC, art. 537). O descumprimento pode configurar ato atentatório à dignidade da justiça (CPC, art. 77, IV e § 2º).","O Supremo Tribunal Federal declarou a constitucionalidade do art. 139, IV, do CPC e confiou ao sistema recursal o controle da proporcionalidade das medidas:"], jul:[JM("adi5941")]},
  incidente:{t:"Do incidente de identificação de bens digitais", p:["O Superior Tribunal de Justiça admitiu, em inventário, incidente processual de identificação, classificação e avaliação de bens digitais, conduzido com o auxílio de profissional com expertise digital. Adaptado ao divórcio, o modelo permite concentrar em procedimento paralelo as requisições, a perícia e a avaliação, sem atrasar a partilha dos demais bens:"], jul:[JM("resp2124424")]},
  desconsideracao:{t:"Da desconsideração inversa da personalidade jurídica", p:["Se a parte requerida se valer de sociedade empresária ou de interposta pessoa para manter criptoativos fora da partilha, cabe a desconsideração inversa da personalidade jurídica (CPC, art. 133, § 2º), admitida pelo Superior Tribunal de Justiça nas relações conjugais:"], jul:[JM("agint1243409")]}
};

function contextoMinuta(c){
  const i=c.inicial; const cen=cenariosInicio(c); const pc0=c.peca||{};
  const ue = pc0.acao? pc0.acao==="uniao" : i.regime==="uniao_estavel_sem_contrato";
  const corrCad=(i.exchanges||"").split(/[;,]/).map(s=>s.trim()).filter(s=>s && !/não identificad/i.test(s));
  const enderecos=c.enderecos.filter(e=>!e.demo && !e.simulado).map(e=>e.endereco);
  const pc={}; c.evidencias.filter(e=>e.achado && e.achado.corretora && e.achado.sentido==="enviado").forEach(e=>{ const a=e.achado; const o=pc[a.corretora]||(pc[a.corretora]={nome:a.corretora,n:0,total:0,ini:a.data,fim:a.data,cnpj:"",razao:"",jan:0,apos:0});
    o.n++; o.total+=Math.abs(a.valor); if(a.faixa==="janela") o.jan+=Math.abs(a.valor); if(a.faixa==="apos") o.apos+=Math.abs(a.valor); if(a.data<o.ini) o.ini=a.data; if(a.data>o.fim) o.fim=a.data; if(a.cnpj&&!o.cnpj){ o.cnpj=a.cnpj; o.razao=a.razao; } });
  Object.values(pc).forEach(o=>{ if(!o.cnpj){ const k=corretorasAtivas().find(x=>x.nome===o.nome); const cj=k&&k.cnpjs&&k.cnpjs[0]; if(cj){ o.cnpj=cj.cnpj; o.razao=cj.razao; } } });
  const porCorr=Object.values(pc).sort((a,b)=>b.total-a.total);
  const nomeCorr = o => `${o.nome}${o.cnpj?` (${o.razao.replace(/ \(.*$/,"")}, CNPJ ${fmtCNPJ(o.cnpj)})`:` (${PH("razão social e CNPJ a confirmar")})`}`;
  const corretoras=[...new Set([...porCorr.map(o=>o.nome), ...corrCad])];
  const lanc=c.evidencias.filter(e=>e.achado && e.achado.corretora);
  const periodoExt = lanc.length? [lanc.map(e=>e.achado.data).sort()[0], lanc.map(e=>e.achado.data).sort().pop()] : null;
  return { ue, cen, dIni: cen[0]?.data||"", dSep:i.dataSeparacao||"", corretoras, enderecos, porCorr, nomeCorr, periodoExt,
    temExtrato: porCorr.length>0,
    requerente: (pc0.requerente||"").trim() || PH("NOME DA PARTE REQUERENTE"),
    requerido: (pc0.requerido||"").trim() || (i.nome? i.nome : PH("NOME DA PARTE REQUERIDA")),
    conta: CONTA_EXT[pc0.conta||""],
    dt: d => d? fmtData(d) : PH("data") };
}

  P(`Tramitam em segredo de justiça os processos que versem sobre ${ue?"união estável":"divórcio"} e partilha (CPC, art. 189, II). O sigilo se impõe também porque a ação envolverá dados bancários e fiscais das partes.`);
  B.push({k:"h3", t:"I.2. Da gratuidade da justiça"});
  P(`${G.Req} não tem condições de arcar com as custas e despesas processuais sem prejuízo do próprio sustento, conforme declaração anexa, fazendo jus à gratuidade da justiça (CPC, arts. 98 e 99, § 3º). ${PH("suprimir este tópico se não for o caso")}`);
  B.push({k:"h3", t:"I.3. Da audiência de conciliação ou mediação"});
  P(`${G.Req} manifesta ${PH("interesse / desinteresse")} na realização de audiência de mediação (CPC, arts. 319, VII, e 695).`);
  // II. Fatos
  B.push({k:"h2", t:"II. DOS FATOS"});
  B.push({k:"h3", t: ue? "II.1. Da união estável" : "II.1. Do casamento"});
  P(ue? `As partes conviveram em união estável, de forma pública, contínua e duradoura, com o objetivo de constituir família, desde ${x.dt(dIniReq)}, ${PH("descrever os elementos da convivência: residência comum, dependência em plano de saúde, contas conjuntas, filhos etc.")}. Não havia contrato escrito, de modo que se aplica o regime da comunhão parcial de bens.`
      : `As partes casaram-se em ${x.dt(dIniReq)}, sob o regime da comunhão parcial de bens, conforme certidão de casamento anexa (doc. ${PH("__")}).`);
  P(`${PH("Da união não advieram filhos. / Da união advieram os filhos ... (nomes e datas de nascimento); guarda, convivência e alimentos são tratados em tópico próprio ou em ação própria.")}`);
  P(`As partes estão separadas de fato desde ${x.dt(x.dSep)}, não havendo possibilidade de reconciliação.`);
  B.push({k:"h3", t:"II.2. Dos criptoativos"});
  if(x.temExtrato){
    const tot=x.porCorr.reduce((s,o)=>s+o.total,0), jan=x.porCorr.reduce((s,o)=>s+o.jan,0), ap=x.porCorr.reduce((s,o)=>s+o.apos,0); const j=janelaCaso(c);
    P(`${G.Req} tem ciência, por meio dos extratos bancários ${x.conta} relativos ao período de convivência, que ora se juntam (doc. ${PH("__")}), de que ${G.rdo} transferiu recursos a prestadoras de serviços de ativos virtuais, as chamadas corretoras de criptoativos, a saber:`);
    x.porCorr.forEach(o=>B.push({k:"li", t:`${x.nomeCorr(o)}: ${qtd(o.n,"transferência","transferências")}${o.n>1?` entre ${fmtData(o.ini)} e ${fmtData(o.fim)}`:` em ${fmtData(o.ini)}`}, no total de ${brl(o.total)}.`}));
    P(`Ao todo, foram transferidos ${brl(tot)} às corretoras${jan||ap?`, dos quais ${[jan?`${brl(jan)} nos ${j?j.dias:90} dias anteriores à separação de fato`:"", ap?`${brl(ap)} depois dela`:""].filter(Boolean).join(" e ")}, movimentação que reforça a urgência das medidas de preservação`:""}.`);
    const bco=c.evidencias.filter(e=>e.achado && e.achado.categoria==="banco");
    if(bco.length) P(`Os extratos registram, ainda, ${qtd(bco.length,"lançamento","lançamentos")} cujo histórico indica operação com criptoativos na própria instituição bancária (${bco.map(e=>`${fmtData(e.achado.data)}, ${brl(Math.abs(e.achado.valor))}`).join("; ")}).`);
    P(`Essas transferências indicam que ${G.rdo} adquiriu criptoativos na constância da união. ${G.Req}, contudo, não tem acesso às contas nas corretoras nem às carteiras digitais, cujas informações estão exclusivamente com ${G.rdo}, o que torna necessárias as diligências adiante requeridas.`);
  } else {
    P(`${G.Req} tem fundadas razões para crer que ${G.rdo} adquiriu e mantém criptoativos adquiridos na constância da união: ${PH("descrever os indícios concretos, como conversas preservadas em ata notarial, comentários sobre investimentos em bitcoin, aplicativos de corretora no celular, declarações de imposto de renda ou gastos incompatíveis com a renda declarada")}.`);
    P(`Como as informações sobre contas em corretoras e carteiras digitais estão exclusivamente com ${G.rdo}, são necessárias as diligências adiante requeridas, que vão das menos às mais gravosas.`);
  }
  if(minutaOpc.fatos){
    c.evidencias.filter(e=>!e.achado).forEach(e=>P(`Consta ainda o documento de ${e.ref||PH("fls.")}, ${(TIPOS_EVID[e.tipo]||"documento").toLowerCase()}, que registra: ${e.descricao.replace(/\s+$/,"")}`));
    c.consultas.filter(q=>q.tipo==="endereco" && q.txs && q.completo).forEach(q=>{
      const sal=x.dSep? saldoAte(q.txs, x.dSep) : null; const mv=movimentosInvestigar(q.txs,c); const j=janelaCaso(c);
      P(`Consulta pública à blockchain, realizada em ${fmtData(q.em)}${q.simulado?" [dados simulados da demonstração]":""}, mostra que o endereço ${q.alvoRotulo||q.alvo} (${PH("indicar onde consta dos autos")}) ${sal!=null? `mantinha ${fmtQ(sal,"BTC")} na data da separação de fato` : "registrou as movimentações juntadas"}${mv.janela?`, com saídas de ${fmtQ(mv.janela,"BTC")} nos ${j.dias} dias anteriores`:""}${mv.apos?` e de ${fmtQ(mv.apos,"BTC")} após a separação`:""}.`);
    });
  }
  B.push({k:"h3", t:"II.3. Dos demais bens comuns"});
  P("Além dos criptoativos, integram o patrimônio comum os seguintes bens, a serem partilhados:");
  [`imóveis: ${PH("descrever, com matrícula, endereço e valor estimado")};`, `veículos: ${PH("modelo, ano, placa e valor estimado")};`, `contas bancárias e aplicações financeiras: ${PH("instituição e saldo na data da separação de fato")};`, `participações societárias: ${PH("sociedade, CNPJ e cotas")};`, `bens móveis que guarneciam a residência: ${PH("descrever")};`, `dívidas comuns: ${PH("credor, valor e origem")}.`].forEach((t,k)=>B.push({k:"li", t:`${String.fromCharCode(97+k)}) ${t}`}));
  // III. Direito
  B.push({k:"h2", t:"III. DO DIREITO"});
  let n=1; const citados=new Set();
  const citar = m => { if(citados.has(m.e)){ P(`Nesse sentido, o julgado já transcrito (${JULGADOS[m.j].cit}).`); return; } citados.add(m.e); B.push({k:"q",t:EMENTAS_MINUTA[m.e]||EMENTAS_TCC[m.e]}); B.push({k:"cit",t:`(${JULGADOS[m.j].cit})`}); };
  const sec = (t, ps, juls) => { B.push({k:"h3", t:`III.${n++}. ${t}`}); ps.forEach((p,ix)=>{ P(p); if(ix===ps.length-1 && juls.length && !juls[0].intro) citar(juls[0]); }); juls.forEach((m,ix)=>{ if(ix===0 && !m.intro) return; if(m.intro && !citados.has(m.e)) P(m.intro); citar(m); }); };
  if(ue) sec("Do reconhecimento e da dissolução da união estável", ["É reconhecida como entidade familiar a união estável configurada na convivência pública, contínua e duradoura, estabelecida com o objetivo de constituição de família (CC, art. 1.723). Na falta de contrato escrito, aplica-se às relações patrimoniais dos companheiros o regime da comunhão parcial de bens (CC, art. 1.725). Presentes esses requisitos, impõe-se o reconhecimento da união e sua dissolução, com a partilha dos bens comuns."], []);
  else sec("Do divórcio", ["Desde a Emenda Constitucional nº 66/2010, que deu nova redação ao art. 226, § 6º, da Constituição Federal, o casamento civil pode ser dissolvido pelo divórcio sem exigência de prévia separação judicial ou de prazo, bastando a vontade de um dos cônjuges. O divórcio põe fim à sociedade conjugal (CC, art. 1.571, IV) e pode ser concedido sem que haja prévia partilha de bens (CC, art. 1.581).", `Quanto ao nome, ${G.req} ${PH("pretende voltar a usar o nome de solteira / manterá o nome de casada")} (CC, art. 1.571, § 2º).`], []);
  sec("Da comunicabilidade dos criptoativos adquiridos na constância da união",
    ["Comunicam-se os bens adquiridos na constância da união por título oneroso, ainda que só em nome de um dos cônjuges (CC, arts. 1.658 e 1.660, I), e os frutos percebidos nesse período (art. 1.660, V). Os criptoativos, como bens móveis, presumem-se adquiridos na constância quando não se provar que o foram em data anterior (CC, art. 1.662). Sobre os bens adquiridos onerosamente, há presunção absoluta de esforço comum:"],
    [JM("agrg1475560"), JM("resp1739042","A falta de registro formal não impede a partilha de bens com expressão econômica:"), JM("resp2127038_valor","Os criptoativos, aliás, são bens de valor econômico, como reconheceu o Superior Tribunal de Justiça:","resp2127038"), JM("resp2223719","A separação de fato delimita o que se comunica:")]);
  const descr=["Os criptoativos devem ser descritos por espécie, quantidade em unidades, local de custódia e data de aquisição. A meação deve ser apurada em quantidade, e não pelo valor em reais em data passada, porque o valor dos bens comuns acompanha o mercado até a partilha; converter o ativo em quantia fixa antes disso transferiria a uma só das partes os ganhos ou as perdas do período."];
  if(minutaOpc.calculo && noEscopo(c) && (c.lotes||[]).length){ const M=calcularMeacao(c);
    descr.push(`Pelos lotes até aqui identificados, ${M.cenarios.map(s=>`${M.cenarios.length>1?`no cenário em que a união começa em ${fmtData(s.data)}, `:""}${Object.values(s.porAtivo).map(a=>`comunicam-se ${fmtQ(a.com,a.ativo)}, cabendo a cada parte ${fmtQ(a.meacao,a.ativo)}`).join("; ")}`).join("; ")}${(c.lotes||[]).some(l=>l.ficticio)?" [lotes fictícios da demonstração]":""}.`); }
  sec("Da descrição dos criptoativos e da apuração da meação", descr, []);
  if(ped.length){ B.push({k:"h3", t:`III.${n++}. Das diligências necessárias`}); P(`As medidas a seguir seguem a ordem das menos às mais gravosas: preservar os indícios, exigir ${G.aoRdo} as informações que detém, requisitar a terceiros os registros não apresentados, periciar os dados obtidos e, se necessário, extrair consequências da recusa em colaborar.`); }
  ped.forEach(p=>{ const f=FUND_MINUTA[p.id]; if(!f) return; sec(f.t, f.p, f.jul); });
  if(ped.some(p=>SIGILO.has(p.id))) sec("Da proporcionalidade das medidas", ["As medidas requeridas respeitam a intimidade, a vida privada e o sigilo de dados (CF, art. 5º, X e XII): limitam-se ao necessário para identificar os ativos comuns, e o tratamento de dados pessoais para o exercício regular de direitos em processo judicial é admitido pela Lei nº 13.709/2018 (art. 7º, VI)."], []);
  sec("Da partilha", ["Os bens comuns devem ser partilhados igualmente entre as partes. Para não atrasar a divisão dos demais bens, a partilha dos criptoativos deve ocorrer após a conclusão das diligências. Ativos que venham a ser descobertos depois da partilha poderão ser objeto de sobrepartilha, que pressupõe o desconhecimento do bem por uma das partes:"], [JM("resp1204253")]);
  // IV. Pedidos
  B.push({k:"h2", t:"IV. DOS PEDIDOS"});
  P("Diante do exposto, requer:");
  const itens=[];
  itens.push(`a tramitação do feito em segredo de justiça (CPC, art. 189, II);`);
  itens.push(`a concessão da gratuidade da justiça ${PH("suprimir se não for o caso")};`);
  const lim=["cautelar","custodia"].filter(tem).map(id=>REQ_MINUTA[id](x).replace(/;$/,""));
  if(tem("corretoras")) lim.push("a imediata suspensão de operações sem autorização judicial nas contas que a parte requerida mantiver nas prestadoras de serviços de ativos virtuais");
  if(lim.length) itens.push(`liminarmente, sem a oitiva da parte contrária, por estarem presentes a probabilidade do direito e o perigo de dano (CPC, art. 300): ${lim.map((t,k)=>`(${k+1}) ${t}`).join("; ")};`);
  itens.push(`a citação ${G.doRdo} para comparecer à audiência de mediação e, não havendo acordo, apresentar contestação, sob pena de revelia (CPC, arts. 334 e 695);`);
  itens.push(ue? `o reconhecimento da união estável havida entre as partes de ${x.dt(dIniReq)} a ${x.dt(x.dSep)} e sua dissolução;` : `a decretação do divórcio das partes, ${PH("com o retorno da Requerente ao nome de solteira / com a manutenção do nome de casada")};`);
  ped.filter(p=>p.id!=="cautelar" && p.id!=="custodia").forEach(p=>{ const f=REQ_MINUTA[p.id]; if(f) itens.push(f(x)); });
  itens.push(`a partilha igualitária dos bens comuns relacionados no item II.3;`);
  itens.push(`que os criptoativos sejam descritos por espécie, quantidade, custódia e data de aquisição e partilhados, após a conclusão das diligências, em quantidade de unidades, ressalvada a sobrepartilha de ativos que venham a ser descobertos;`);
  itens.push(`a condenação ${G.doRdo} ao pagamento das custas processuais e dos honorários advocatícios (CPC, art. 85).`);
  itens.forEach((t,k)=>B.push({k:"li", t:`${String.fromCharCode(97+k)}) ${t}`}));
  P("Protesta provar o alegado por todos os meios de prova admitidos, especialmente documental, depoimento pessoal da parte contrária, testemunhal e pericial.");
  P(`Dá-se à causa o valor de R$ ${PH("valor dos bens a partilhar")} (CPC, art. 291).`);
  P("Termos em que pede deferimento.");
  P(`${(pc0.comarca||"").trim()||PH("Local")}, ${PH("data")}.`);
  P(`${(pc0.advogado||"").trim()||PH("Nome do advogado")} · OAB/${(pc0.oab||"").trim()||PH("UF nº")}`);
  B.push({k:"h3", t:"Documentos anexos"});
  [`procuração e documentos pessoais ${G.daReq};`, ue? `documentos que comprovam a união estável ${PH("indicar")};` : `certidão de casamento;`, x.temExtrato? `extratos bancários do período de convivência (doc. ${PH("__")});` : `documentos que indicam a existência de criptoativos ${PH("indicar")};`, `documentos dos demais bens ${PH("matrículas, documentos de veículos, extratos")};`, `declaração de hipossuficiência ${PH("se for o caso")}.`].forEach(t=>B.push({k:"li", t}));
  const ajusta = t => t.split("pela parte requerida").join(G.gD==="f"?"pela Requerida":"pelo Requerido").split("da parte requerida").join(G.doRdo).split("à parte requerida").join(G.aoRdo).split("A parte requerida").join(G.Rdo).split("a parte requerida").join(G.rdo);
  B.forEach(b=>{ if(b.k!=="q" && b.k!=="cit") b.t=ajusta(b.t); });
  return {blocos:B, pedidos:ped, ficticio:c.ficticio, temExtrato:x.temExtrato};
}

/* Lê o texto editado direto na tela e guarda como blocos (só texto, sem HTML). */
const CLS_BLOCO = {"m-h1":"h1","m-tit":"tit","m-h2":"h2","m-h3":"h3","m-li":"li","m-cit":"cit","m-q":"q","m-p":"p"};
function lerBlocosEditados(el){
  const out=[]; [...el.children].forEach(n=>{ const t=(n.innerText||"").replace(/\u00a0/g," ").replace(/\s+\n/g,"\n").trim(); if(!t) return;
    const cls=[...n.classList].find(k=>CLS_BLOCO[k]); const k= n.tagName==="BLOCKQUOTE"? "q" : cls? CLS_BLOCO[cls] : "p";
    t.split(/\n{2,}/).forEach(parte=>{ if(parte.trim()) out.push({k, t:parte.trim()}); }); });
  return out;
}
let edTimer=null, edSujo=false;
function salvarEdicao(){ const el=$("#minutaEd"); const c=casoAtivo(); if(!el||!c||!edSujo) return; edSujo=false; c.peca=c.peca||{}; c.peca.blocos=lerBlocosEditados(el); salvar();
  if(!$(".edit-note")){ const d=document.createElement("div"); d.className="note acc small edit-note"; d.innerHTML='<b>Você editou o texto da petição.</b> As opções acima ficam travadas para não apagar suas edições. <button class="link" data-act="descartarEdicao">Descartar edições e gerar de novo</button>'; el.parentNode.insertBefore(d, el); } }
document.addEventListener("input", ev=>{ if(ev.target && ev.target.id==="minutaEd"){ edSujo=true; clearTimeout(edTimer); edTimer=setTimeout(salvarEdicao, 500); } });
document.addEventListener("focusout", ev=>{ if(ev.target && ev.target.id==="minutaEd"){ clearTimeout(edTimer); salvarEdicao(); } });
const editada = c => !!(c && c.peca && Array.isArray(c.peca.blocos) && c.peca.blocos.length);
const marcarPH = s => esc(s).replace(/\[[^\]]+\]/g, m=>`<mark>${m}</mark>`);
function minutaHTML(M){
  return M.blocos.map(b=> b.k==="h1"? `<p class="m-h1">${marcarPH(b.t)}</p>` : b.k==="tit"? `<p class="m-tit">${marcarPH(b.t)}</p>` : b.k==="h2"? `<p class="m-h2">${marcarPH(b.t)}</p>` : b.k==="h3"? `<p class="m-h3">${marcarPH(b.t)}</p>`
    : b.k==="q"? `<blockquote class="m-q">${marcarPH(b.t)}</blockquote>` : b.k==="cit"? `<p class="m-cit">${marcarPH(b.t)}</p>` : b.k==="li"? `<p class="m-li">${marcarPH(b.t)}</p>` : `<p class="m-p">${marcarPH(b.t)}</p>`).join("");
}
function minutaTexto(M){ return M.blocos.map(b=> b.k==="q"? "    "+b.t : b.k==="li"? "  "+b.t : b.t).join("\n\n"); }
function minutaDoc(M, c){
  const css=`body{font-family:"Times New Roman",serif;font-size:12pt;line-height:1.5;margin:2.5cm 3cm 2cm 3cm} p{margin:0 0 12pt;text-align:justify;text-indent:1.25cm} .m-h1{font-weight:bold;text-indent:0;text-align:left;margin-bottom:48pt} .m-tit{font-weight:bold;text-indent:0;text-align:center;margin:18pt 0} .m-h2{font-weight:bold;text-indent:0;margin-top:18pt} .m-h3{font-weight:bold;font-style:italic;text-indent:0} .m-li{text-indent:0;margin-left:1.25cm} blockquote{margin:0 0 6pt 4cm;font-size:10pt;line-height:1;text-align:justify} .m-cit{text-indent:0;margin-left:4cm;font-size:10pt} mark{background:#fff2a8}`;
  return `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Petição inicial ${esc(c.codigo)}</title><style>${css}</style></head><body>${minutaHTML(M)}<p style="font-size:9pt;text-indent:0;color:#666">Modelo gerado pelo CriptoPartilha, desenvolvido por Isabella Vilela Balderramas, sob orientação do Prof. Dr. André Murilo Parente Nogueira. Revise antes de protocolar e preencha os trechos entre colchetes.</p></body></html>`;
}

    case "dataAval": { if(!c.avaliacao) c.avaliacao={data:"",cot:{}}; c.avaliacao.data=fd.data; salvar(); render(); toast("Data de referência definida. Busque ou informe a cotação desta data."); break; }
    case "extCot": { const v=parseValorBR(fd.valor); if(!(v>0)){ toast("Informe o preço em reais."); return; } if(!(fd.fonte||"").trim()){ toast("Informe a fonte do preço."); return; }
      extEstim(c).cot[form.dataset.d]={valor:Math.abs(v), fonte:fd.fonte.trim(), metodo:"Informado manualmente pelo usuário", origem:"manual", consultadoEm:agoraISO(), url:/^https?:\/\//.test(fd.fonte.trim())?fd.fonte.trim():""}; salvar(); render(); toast("Preço do dia registrado."); break; }
    case "cotManual": { const v=parseValorBR(fd.valor); if(!(v>0)){ toast("Informe o preço por unidade em reais."); return; } if(!(fd.fonte||"").trim()){ toast("Informe a fonte da cotação."); return; }
      if(!c.avaliacao) c.avaliacao={data:"",cot:{}}; c.avaliacao.cot[form.dataset.a]={valor:v, data:fd.data, fonte:fd.fonte.trim(), metodo:"Informada manualmente pelo usuário", origem:"manual", consultadoEm:agoraISO(), url:/^https?:\/\//.test(fd.fonte.trim())?fd.fonte.trim():""};
      salvar(); render(); toast("Cotação manual registrada."); break; }
    case "corretora": {
      const nome=(fd.nome||"").trim(); const termos=(fd.termos||"").split(",").map(t=>normT(t)).filter(t=>t.length>=3); const cnpj=soDigitos(fd.cnpj); const fonte=(fd.fonte||"").trim();
      const aviso=m=>{ $("#corrAviso").innerHTML=`<div class="note warn small">${m}</div>`; };
      if(cnpj && !cnpjValido(cnpj)) return aviso("CNPJ inválido: os dígitos verificadores não conferem.");
      if(cnpj && !fonte) return aviso("Informe a fonte pública em que o CNPJ foi confirmado.");
      const l=editarCorretoras(); let alvo=l.find(x=>normT(x.nome)===normT(nome));
      if(!alvo){ alvo={id:uid(), nome, termos:[], cnpjs:[]}; l.push(alvo); }
      if(!termos.length && !alvo.termos.length && normT(nome).length>=3) termos.push(normT(nome));
      termos.forEach(t=>{ if(!alvo.termos.includes(t)) alvo.termos.push(t); });
      if(cnpj && !alvo.cnpjs.some(k=>k.cnpj===cnpj)) alvo.cnpjs.push({cnpj, razao:nome, fonte, url:/^https?:\/\//.test(fonte)?fonte:""});
      salvar(); render(); { const b=$("#boxCorretoras"); if(b) b.open=true; } toast(nome+" incluída na lista."); break; }
    case "lacuna": c.lacunas[form.dataset.id]={status:fd.status,nota:fd.nota,prazo:fd.prazo||""}; salvar(); render(); toast("Ponto atualizado."); break;
    case "provid": c.providencias[form.dataset.id]=Object.assign({},c.providencias[form.dataset.id]||{},{marcada:!!fd.marcada,nota:fd.nota}); salvar(); render(); toast("Anotação registrada."); break;
  }
});

render();
</script>
